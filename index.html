<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191817" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>ダッシュボード</title>
<style>
  html,body{margin:0;height:100%;background:#f6f4f0;color:#6a6560;
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}
  @media (prefers-color-scheme:dark){html,body{background:#191817;color:#a9a29a}}
  #boot{display:flex;align-items:center;justify-content:center;height:100%;
    font-size:13px;text-align:center;line-height:2;padding:20px}
  #boot button{margin-top:14px;display:block;background:transparent;border:1px solid currentColor;
    border-radius:9px;padding:9px 18px;font-size:13px;color:inherit;font-family:inherit}
</style>
</head>
<body>
<div id="boot">読み込み中…</div>
<script>
/* 🔴🔴 この index.html は「毎回いちばん新しい中身を取りに行くだけ」のファイル。
 *
 * なぜこうしたか（2026-08-31 メグの苦情）:
 *   「毎回同じ更新されない問題で、毎回毎回これさせられる。
 *     最初から更新できるようにしてほしい」
 *
 *   中身を index.html に直接書いていたころは、スマホがその index.html ごと
 *   キャッシュから返してしまい、新しい版を取ってくる判定すら走らなかった。
 *   そのたびにメグへ「ブックマークを開き直して」「アイコンを消して」と
 *   手作業を頼んでいた。それが間違いだった。
 *
 *   実体は app.html に置き、ここから毎回 ?v=<現在時刻> を付けて取る。
 *   URLが毎回違うのでキャッシュに当たらない。ユーザーは何もしなくていい。
 *
 * 🔴 このファイルは基本的に触らない。中身を直すときは app.html を直す。
 */
(function () {
  var box = document.getElementById('boot');

  /* 取ってきたHTMLを、この文書に展開する。
   * 🔴 document.write は使わない。app.html の中の文字列に script の終了タグが入っており
   *    （JSのソースを扱う箇所がある）、書き出しの途中でスクリプトが切れてしまう。
   *    head と body を入れ替えてから、script だけ作り直して実行する。 */
  function render(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    // <head> の中身（style / link / meta / title）を移す
    var frag = document.createDocumentFragment();
    Array.prototype.forEach.call(doc.head.children, function (n) {
      if (n.tagName === 'SCRIPT') return;
      frag.appendChild(document.importNode(n, true));
    });
    document.head.appendChild(frag);
    // <body> を差し替える
    document.body.innerHTML = doc.body.innerHTML;
    // script は innerHTML では走らないので、作り直して順に実行する
    var scripts = doc.body.querySelectorAll('script');
    Array.prototype.forEach.call(scripts, function (old) {
      var el = document.createElement('script');
      Array.prototype.forEach.call(old.attributes, function (a) { el.setAttribute(a.name, a.value); });
      el.textContent = old.textContent;
      document.body.appendChild(el);
    });
  }

  function fail(msg) {
    box.innerHTML = '読み込めませんでした<br><span style="opacity:.7;font-size:12px">' + msg + '</span>' +
      '<button onclick="location.reload()">もう一度</button>';
  }
  fetch('./app.html?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) { render(html); })
    .catch(function (e) {
      // オフラインでも前回のものが見られるように、最後に読めた中身を残しておく
      var last = null;
      try { last = localStorage.getItem('app_html_backup'); } catch (x) {}
      if (last) {
        render(last);
      } else {
        fail(e.message);
      }
    });
})();
</script>
</body>
</html>
