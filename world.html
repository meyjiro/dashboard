<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>カンブリア 世界地図</title>
<!-- 🧬 カンブリア塾の表紙（2026-09-21 メグ「塗り絵の世界地図を1つの作品に」）。
     地図は1枚・レイヤーを切り替える。国を押すと地図カードの4節と、仕入れた情報の時系列。
     データ: claude-context/knowledge/学習/世界.json（_tools/world-build.py が作る）。トークンは app.html と同じ localStorage.gh_pat -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{--paper:#efe6cf;--card:#f7f1e3;--ink:#2b2418;--ink2:#5c5040;--ink3:#8c8069;--rule:#cdbf9c;--red:#a3402b;--blue:#2f5a78;--green:#4d6b3a;--sea:#e6dcc2}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.75 "Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;
 background-image:radial-gradient(ellipse at 10% 10%,rgba(120,90,40,.10),transparent 40%),radial-gradient(ellipse at 90% 90%,rgba(120,90,40,.12),transparent 40%)}
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(239,230,207,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.top h1{font:800 17px "Shippori Mincho",serif;margin:0;letter-spacing:.06em;white-space:nowrap}
.top .stat{font-size:12px;color:var(--ink2);white-space:nowrap}.top .stat b{font:800 15px "Shippori Mincho",serif;color:var(--red)}
.top a{margin-left:auto;font-size:12px;color:var(--ink3);text-decoration:none;white-space:nowrap}
.layers{position:fixed;left:14px;top:58px;z-index:5;display:flex;gap:6px;flex-wrap:wrap}
.layers button{font:700 12px "Zen Kaku Gothic New",sans-serif;padding:5px 11px;border-radius:999px;border:1px solid var(--rule);background:rgba(255,255,255,.55);color:var(--ink2)}
.layers button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#map{position:fixed;inset:0;top:0}
svg{width:100%;height:100%;display:block;touch-action:none}
.country{stroke:rgba(43,36,24,.35);stroke-width:.4;cursor:pointer;transition:fill .25s}
.country:hover{stroke:var(--ink);stroke-width:1}
.country.sel{stroke:var(--red);stroke-width:1.4}
.legend{position:fixed;left:14px;bottom:14px;z-index:5;background:rgba(247,241,227,.92);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;font-size:11.5px;color:var(--ink2);max-width:260px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
.legend div{margin:2px 0}
.tip{position:fixed;z-index:6;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:3px 9px;border-radius:6px;display:none;white-space:nowrap}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);z-index:7;background:var(--card);border-left:1px solid var(--rule);box-shadow:-12px 0 30px -20px rgba(60,40,10,.5);transform:translateX(102%);transition:transform .25s;overflow:auto;padding:18px 20px 40px}
.panel.open{transform:none}
.panel .x{position:sticky;top:0;float:right;background:transparent;border:0;font-size:22px;line-height:1;color:var(--ink3);cursor:pointer;padding:2px 6px}
.panel h2{font:800 24px "Shippori Mincho",serif;margin:6px 0 2px}
.panel .meta{font-size:12px;color:var(--ink2);margin-bottom:10px}
.chip{display:inline-block;font-size:10.5px;letter-spacing:.08em;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:6px;border:1px solid var(--rule);color:var(--ink2);background:rgba(255,255,255,.5)}
.chip.red{color:var(--red);border-color:var(--red)}.chip.blue{color:var(--blue);border-color:var(--blue)}.chip.green{color:var(--green);border-color:var(--green)}
.lv{display:flex;gap:4px;margin:8px 0 14px}.lv span{flex:1;height:8px;border-radius:2px;background:rgba(0,0,0,.08)}.lv span.on{background:var(--red)}
.sec h3{font:700 13px "Zen Kaku Gothic New",sans-serif;letter-spacing:.1em;color:var(--blue);margin:16px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--rule)}
.sec .body{font-size:13.5px;line-height:1.8}.sec .body p{margin:4px 0}.sec .body li{margin:3px 0}.sec .body ul,.sec .body ol{padding-left:1.3em;margin:4px 0}
.tl{margin-top:6px}.tl .it{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:12.5px;line-height:1.65}
.tl .d{font:700 12px "Shippori Mincho",serif;color:var(--red)}.tl .s{display:block;font-size:10px;color:var(--ink3);letter-spacing:.06em}
.empty{font-size:12.5px;color:var(--ink3);border:1px dashed var(--rule);border-radius:6px;padding:10px 12px}
.msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;font:700 15px "Shippori Mincho",serif;color:var(--ink2);background:rgba(239,230,207,.85)}
@media (max-width:700px){.panel{top:auto;height:72%;width:100%;border-left:0;border-top:1px solid var(--rule);border-radius:14px 14px 0 0;transform:translateY(105%)}.panel.open{transform:none}.legend{bottom:auto;top:100px;max-width:180px}.top .stat.sub{display:none}}
</style>
</head>
<body>
<div class="top"><h1>🧬 カンブリア 世界地図</h1><span class="stat">語れる国 <b id="st-lv">0</b>/<span id="st-total">14</span> 枚</span><span class="stat sub">時系列 <b id="st-items">0</b> 件</span><a href="app.html#learn">← カンブリアへ</a></div>
<div class="layers"><button data-layer="level" class="on">語れる度</button><button data-layer="card">塾のカード</button><button data-layer="camp">陣営（推定）</button><button data-layer="region">地域</button></div>
<div id="map"></div>
<div class="legend" id="legend"></div>
<div class="tip" id="tip"></div>
<div class="panel" id="panel"><button class="x" onclick="closePanel()">×</button><div id="pbody"></div></div>
<div class="msg" id="msg">地図を読み込み中…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const pat = localStorage.getItem('gh_pat') || '';
const REPO = 'meyjiro/claude-context', PATH = 'knowledge/学習/世界.json';
const LV = ['rgba(255,255,255,.55)', '#e8c9a8', '#cf8a6a', '#a3402b'];   // Lv0〜3（古紙→朱）
const CAMP = {'米側':'#2f5a78','中露側':'#a3402b','どちらにも付かない':'#c9b27a'};
const REGION = ['#2f5a78','#4d6b3a','#a3402b','#8b6b3d','#6b4c8a','#3b7f7a','#b0563a','#5a6f8a','#8a7a2f','#a05c7b','#5c8a5a'];
const CARDC = {};
let W = null, layer = 'level', sel = null, feats = [];

async function loadWorld(){
  if(!pat){ $('msg').textContent = 'ダッシュボード（app.html）の⚙設定でGitHubの鍵を入れてから開いてね'; return null; }
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(PATH).replace(/%2F/g,'/')}`, {headers:{Authorization:'token '+pat, Accept:'application/vnd.github.v3+json'}, cache:'no-store'});
  if(!r.ok){ $('msg').textContent = '世界.json を読めなかった（'+r.status+'）'; return null; }
  const j = await r.json();
  return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
}
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function md(s){ // 地図カードの本文（Markdownの最小限）を紙面に
  const lines = String(s||'').split('\n'); let out='', inList=false;
  for(let l of lines){ l = l.replace(/\r/,'');
    const li = l.match(/^\s*(?:[-・]|\d+\.)\s+(.*)$/);
    if(li){ if(!inList){ out+='<ul>'; inList=true; } out += '<li>'+inline(li[1])+'</li>'; continue; }
    if(inList){ out+='</ul>'; inList=false; }
    if(l.trim()) out += '<p>'+inline(l)+'</p>';
  }
  if(inList) out+='</ul>'; return out;
}
function inline(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/https?:\/\/\S+/g, u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,'').slice(0,40)}…</a>`); }

function colorOf(id){
  const c = W.countries[String(id)];
  if(layer==='level'){ if(!c) return 'rgba(255,255,255,.25)'; return c.card ? LV[c.level||0] : 'rgba(255,255,255,.25)'; }
  if(layer==='card'){ if(!c||!c.card) return 'rgba(255,255,255,.25)'; return CARDC[c.card]; }
  if(layer==='camp'){ if(!c||!c.camp) return 'rgba(255,255,255,.25)'; return CAMP[c.camp]; }
  if(layer==='region'){ if(!c) return 'rgba(255,255,255,.25)'; return REGION[W.regions.indexOf(c.region)%REGION.length]; }
}
function legend(){
  let h='';
  if(layer==='level'){ h = '<div><b>語れる度</b>（配置テスト・白紙再現のLv）</div>'+[0,1,2,3].map(i=>`<div><i style="background:${LV[i]}"></i>Lv${i} ${['まだ','聞いたことがある','概要は言える','背景まで語れる'][i]}</div>`).join('')+'<div><i style="background:rgba(255,255,255,.25)"></i>塾のカードに無い国</div>'; }
  else if(layer==='card'){ h='<div><b>塾のカード</b>（14枚のうち国のもの）</div>'+Object.keys(CARDC).map(k=>`<div><i style="background:${CARDC[k]}"></i>${esc(k)}</div>`).join(''); }
  else if(layer==='camp'){ h='<div><b>陣営</b>（2026-09 の整理・推定。週次で見直す）</div>'+Object.keys(CAMP).map(k=>`<div><i style="background:${CAMP[k]}"></i>${k}</div>`).join(''); }
  else { h='<div><b>地域</b></div>'+W.regions.map((r,i)=>`<div><i style="background:${REGION[i%REGION.length]}"></i>${r}</div>`).join(''); }
  $('legend').innerHTML = h;
}
function paint(){ d3.selectAll('.country').attr('fill', d=>colorOf(d.id)); legend(); }

function openPanel(id){
  const c = W.countries[String(id)]; const f = feats.find(x=>String(x.id)===String(id));
  sel = String(id); d3.selectAll('.country').classed('sel', d=>String(d.id)===sel);
  const name = c ? c.ja : (f && f.properties && f.properties.name) || '？';
  let h = `<h2>${esc(name)}</h2><div class="meta">${c?esc(c.en):''}</div>`;
  if(c){
    h += `<div>${c.region?`<span class="chip">${esc(c.region)}</span>`:''}${c.camp?`<span class="chip ${c.camp==='米側'?'blue':c.camp==='中露側'?'red':''}">${esc(c.camp)}・推定</span>`:''}${c.card?`<span class="chip green">塾: ${esc(c.card)}</span>`:''}</div>`;
    if(c.card){
      const lv = c.level||0;
      h += `<div class="lv">${[1,2,3].map(i=>`<span class="${i<=lv?'on':''}"></span>`).join('')}</div>`;
      const card = W.cards[c.card]||{}; const S = card.sections||{};
      for(const k of ['①','②','③','④']){ if(S[k]) h += `<div class="sec"><h3>${k} ${esc(S[k].h.replace(/（.*?）/,''))}</h3><div class="body">${md(S[k].body)}</div></div>`; }
      h += `<div class="sec"><h3>⑤ 仕入れた情報（時系列）</h3>`;
      if(c.items && c.items.length){ h += '<div class="tl">'+c.items.map(it=>`<div class="it"><div class="d">${esc(it.date||'—')}<span class="s">${esc(it.src)}</span></div><div>${inline(it.text)}</div></div>`).join('')+'</div>'; }
      else h += `<div class="empty">この国の名前で拾えた情報はまだ無い。カード「${esc(c.card)}」の②と⑤に溜まっていくのだ</div>`;
      h += '</div>';
    } else {
      h += `<div class="empty" style="margin-top:10px">塾のカードにはまだ無い国。カンブリアの「聞きたい」で聞けば、答えが板に残り、「覚える」で課になる</div>`;
      if(c.items && c.items.length){ h += '<div class="tl">'+c.items.map(it=>`<div class="it"><div class="d">${esc(it.date||'—')}<span class="s">${esc(it.src)}</span></div><div>${inline(it.text)}</div></div>`).join('')+'</div>'; }
    }
  } else h += `<div class="empty">この国はまだ一覧に無い（世界.json に未登録）</div>`;
  $('pbody').innerHTML = h; $('panel').classList.add('open'); $('panel').scrollTop = 0;
}
function closePanel(){ $('panel').classList.remove('open'); sel=null; d3.selectAll('.country').classed('sel', false); }

async function main(){
  W = await loadWorld(); if(!W) return;
  Object.keys(W.cards).forEach((k,i)=>{ if(W.cards[k].countries && W.cards[k].countries.length) CARDC[k] = REGION[Object.keys(CARDC).length%REGION.length]; });
  const geo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json')).json();
  feats = topojson.feature(geo, geo.objects.countries).features;
  // 統計
  const cards = Object.values(W.cards).filter(c=>c.countries&&c.countries.length);
  $('st-total').textContent = cards.length; $('st-lv').textContent = cards.filter(c=>(c.level||0)>=2).length;
  $('st-items').textContent = Object.values(W.countries).reduce((a,c)=>a+(c.items||[]).length,0);
  const box = $('map'); const w = box.clientWidth, h = box.clientHeight;
  const svg = d3.select('#map').append('svg').attr('viewBox', `0 0 ${w} ${h}`);
  const g = svg.append('g');
  const proj = d3.geoNaturalEarth1().fitExtent([[10,70],[w-10,h-20]], {type:'FeatureCollection', features:feats});   // 面積が正しめの図法
  const path = d3.geoPath(proj);
  g.append('path').datum({type:'Sphere'}).attr('d', path).attr('fill','var(--sea)').attr('stroke','var(--rule)');
  g.selectAll('.country').data(feats).join('path').attr('class','country').attr('d', path)
    .on('mousemove', (e,d)=>{ const c=W.countries[String(d.id)]; const t=$('tip'); t.style.display='block'; t.style.left=(e.clientX+12)+'px'; t.style.top=(e.clientY-8)+'px'; t.textContent = (c?c.ja:(d.properties.name||'')) + (c&&c.card?`　Lv${c.level||0}`:''); })
    .on('mouseleave', ()=>{ $('tip').style.display='none'; })
    .on('click', (e,d)=>{ e.stopPropagation(); openPanel(d.id); });
  svg.call(d3.zoom().scaleExtent([1,8]).on('zoom', e=>g.attr('transform', e.transform)));
  svg.on('click', ()=>closePanel());
  paint(); $('msg').remove();
  document.querySelectorAll('.layers button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.layers button').forEach(x=>x.classList.toggle('on', x===b)); layer=b.dataset.layer; paint(); });
}
main().catch(e=>{ $('msg').textContent = '読み込みに失敗: '+e.message; });
</script>
</body>
</html>
