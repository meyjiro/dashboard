<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f5c48">
<meta name="robots" content="noindex, nofollow">
<title>道場</title>
<link rel="icon" href="dojo/icon.png">
<link rel="apple-touch-icon" href="dojo/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f6f1ea; --paper:#fffdf9; --ink:#241a14; --ink2:#5d4e44; --line:#e4d9cc;
  --accent:#1f5c48; --accent-ink:#ffffff; --gold:#d8a63a; --gold-ink:#3d2b06;
  --ok:#2e7d4f; --ok-bg:#dff3e6; --ng:#b3362e; --ng-bg:#fbe1de; --crema:#e9c98a; --espresso:#3b2418;
  --shadow:0 6px 24px rgba(59,36,24,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17120f; --paper:#221a15; --ink:#f3ebe2; --ink2:#c2b3a6; --line:#3a2e26;
  --accent:#4fa286; --accent-ink:#0f1f19; --gold:#e5b95a; --gold-ink:#2b1e05;
  --ok:#6fcf97; --ok-bg:#1f3a2c; --ng:#f28b82; --ng-bg:#4a2422; --crema:#b98f4f; --espresso:#e9d6c3; --shadow:0 6px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{ --bg:#17120f; --paper:#221a15; --ink:#f3ebe2; --ink2:#c2b3a6; --line:#3a2e26; --accent:#4fa286; --accent-ink:#0f1f19; --gold:#e5b95a; --gold-ink:#2b1e05; --ok:#6fcf97; --ok-bg:#1f3a2c; --ng:#f28b82; --ng-bg:#4a2422; --crema:#b98f4f; --espresso:#e9d6c3; --shadow:0 6px 24px rgba(0,0,0,.35); }
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.75;padding:0 16px calc(84px + env(safe-area-inset-bottom));}
h1,h2,h3{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;text-wrap:balance;line-height:1.3;margin:0}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto}
/* header */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px;padding-top:calc(14px + env(safe-area-inset-top))}
.top h1{font-size:20px;font-weight:900;letter-spacing:.02em}
.top .sub{font-size:12px;color:var(--ink2);margin-left:auto;text-align:right;line-height:1.3}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink2);padding:4px 0;border-radius:10px}
.tabs button .ic{font-size:20px;line-height:1}
.tabs button.on{color:var(--accent);font-weight:700}
/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.chap{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.chap .em{font-size:28px;width:40px;text-align:center;flex:none}
.chap .t{font-weight:700;font-size:15px}
.chap .m{font-size:12px;color:var(--ink2)}
.chap .badge{margin-left:auto;flex:none;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink2)}
.chap .badge.ok{background:var(--ok-bg);color:var(--ok);font-weight:700}
.chap .badge.gold{background:var(--gold);color:var(--gold-ink);font-weight:700}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:48px;width:100%;font-size:16px}
.btn.sub{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;width:auto}
/* lesson */
.lesson h2{font-size:24px;font-weight:900;margin:6px 0 8px}
.lesson .lead{font-size:15px;color:var(--ink2);margin:0 0 14px}
.lesson h3{font-size:17px;font-weight:700;margin:22px 0 6px;padding-left:10px;border-left:4px solid var(--gold)}
.lesson p{margin:0 0 10px}
.fig{margin:14px 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;overflow:hidden}
.fig{overflow-x:auto;-webkit-overflow-scrolling:touch} .fig svg{display:block;width:100%;min-width:560px;height:auto}
.fig .cap{font-size:12px;color:var(--ink2);text-align:center;margin-top:4px}
.figwrap{position:relative} .figwrap .zoom{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;box-shadow:var(--shadow)}
.fighint{font-size:11px;color:var(--ink2);text-align:center;margin:-8px 0 10px} @media (min-width:600px){.fighint{display:none}}
.figov{position:fixed;inset:0;background:#fffdf9;z-index:50;overflow:auto;padding:56px 12px 20px;-webkit-overflow-scrolling:touch} .figov svg{display:block;width:100%;min-width:820px;height:auto} .figov .x{position:fixed;top:12px;right:12px;background:var(--espresso);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px} .figov .t{position:fixed;top:14px;left:14px;color:#2b1d16;font-weight:700;font-size:14px;font-family:'Zen Maru Gothic',sans-serif}
.keys{background:var(--paper);border:2px solid var(--gold);border-radius:14px;padding:14px 16px;margin:18px 0}
.keys h4{margin:0 0 8px;font-size:14px;color:var(--gold-ink);background:var(--gold);display:inline-block;padding:2px 10px;border-radius:999px}
.keys ol{margin:0;padding-left:20px} .keys li{margin:4px 0;font-weight:500}
.terms{margin:14px 0;display:grid;gap:8px}
.term{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.term b{color:var(--accent)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:16px 0}
.nav button{font-size:14px;color:var(--accent);font-weight:700;padding:10px 4px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);margin:8px 0}
.qtop .bar{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.qtop .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.q{font-size:19px;font-weight:700;line-height:1.55;margin:10px 0 16px;font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px 14px;background:var(--paper);border:2px solid var(--line);border-radius:14px;font-size:16px;line-height:1.45;min-height:56px;transition:transform .08s}
.choice:active{transform:scale(.985)}
.choice .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--ink2)}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)} .choice.ok .k{background:var(--ok);color:#fff}
.choice.ng{border-color:var(--ng);background:var(--ng-bg)} .choice.ng .k{background:var(--ng);color:#fff}
.choice.dim{opacity:.45}
.choice.picked{outline:3px solid var(--accent)}
.fb{margin:14px 0;padding:12px 14px;border-radius:12px;font-size:15px;background:var(--paper);border:1px solid var(--line)}
.fb.ok{border-color:var(--ok)} .fb.ng{border-color:var(--ng)}
.fb b{display:block;font-size:18px;margin-bottom:4px}
.fb.ok b{color:var(--ok)} .fb.ng b{color:var(--ng)}
.stamp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:120px;opacity:0;z-index:20}
.stamp.show{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.timer{font-size:13px;color:var(--ink2)}
.sd{position:fixed;inset:0;background:rgba(36,26,20,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sd-card{background:var(--paper);color:var(--ink);border-radius:20px;padding:20px;width:100%;max-width:520px;box-shadow:var(--shadow)}
.sd-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sd-row .muted{font-size:12px}
.sw{flex:none;width:54px;height:32px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:left .2s}
.sw.on{background:var(--accent)} .sw.on i{left:25px} .sw:disabled{opacity:.4}
.listen{margin:12px 0;padding:10px 14px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:14px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.timer.warn{color:var(--ng);font-weight:700}
/* result */
.score{text-align:center;padding:18px 0 6px}
.score .big{font-size:64px;font-weight:900;line-height:1;font-family:"Zen Maru Gothic",sans-serif}
.score .big small{font-size:22px;color:var(--ink2);font-weight:700}
.score .msg{font-size:18px;font-weight:700;margin-top:6px}
.score .meta{font-size:13px;color:var(--ink2);margin-top:4px}
.rlist{display:grid;gap:8px;margin:14px 0}
.r{display:flex;gap:10px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;font-size:14px}
.r .m{flex:none;font-weight:900;width:22px}
.r.ok .m{color:var(--ok)} .r.ng .m{color:var(--ng)}
.r .e{color:var(--ink2);font-size:13px;margin-top:2px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--line);color:var(--ink2)}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.opts button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px}
.opts button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
/* stats */
.mastery{display:grid;gap:6px}
.mrow{display:grid;grid-template-columns:28px 1fr 56px;align-items:center;gap:8px;font-size:14px}
.mrow .b{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.mrow .b i{display:block;height:100%;background:var(--accent)}
.hist{display:flex;align-items:flex-end;gap:6px;height:110px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.hist .c{flex:1;background:var(--accent);border-radius:6px 6px 0 0;position:relative;min-width:10px}
.hist .c.exam{background:var(--gold)}
.hist .c span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink2)}
.hlist{font-size:13px;color:var(--ink2);margin-top:8px}
.hlist div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
/* gate */
.gate{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.gate .cup{font-size:64px}
.gate input{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:100%;text-align:center}
.gate .err{color:var(--ng);font-size:14px;min-height:1.5em}
.muted{color:var(--ink2);font-size:13px}
.hero{background:linear-gradient(135deg,var(--espresso),#6b3f28);color:#fff7ea;border-radius:18px;padding:18px;margin:8px 0 14px}
.hero h2{font-size:22px;font-weight:900;color:#fff7ea}
.hero p{margin:6px 0 0;font-size:14px;color:#f0dcc3}
.hero .num{font-size:28px;font-weight:600;color:var(--crema)}

/* 本文の強弱 */
.hl{font-weight:700;color:var(--ink);background:linear-gradient(transparent 55%,rgba(216,166,58,.45) 55%);padding:0 2px;border-radius:2px}
mark.ex{background:var(--ng-bg);color:var(--ng);font-weight:700;padding:1px 5px;border-radius:6px}
.nb{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:0 6px;border-radius:6px;font-size:.92em;white-space:nowrap}
.co{display:flex;gap:10px;padding:12px 14px;border-radius:12px;margin:10px 0;font-size:15px;line-height:1.6}
.co .ci{flex:none;font-size:20px;line-height:1.3}
.co.exam{background:var(--ng-bg);border:1.5px solid var(--ng)} .co.exam b{color:var(--ng)}
.co.tip{background:var(--ok-bg);border:1.5px solid var(--ok)} .co.tip b{color:var(--ok)}
.co.warn{background:#fff3d6;border:1.5px solid var(--gold)} .co.warn b{color:#8a5a00}
:root[data-theme="dark"] .co.warn,:root:not([data-theme="light"]) .co.warn{background:#3a2c10}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .co.warn{background:#fff3d6} }
.co b{display:block;font-size:12px;letter-spacing:.06em;margin-bottom:2px}
.photo{margin:14px 0;border-radius:14px;overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.photo img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;background:var(--line)}
.photo figcaption{padding:8px 12px;font-size:13px;color:var(--ink2)} .photo .cr{display:block;font-size:11px;opacity:.75;margin-top:2px}
.hero-photo{margin:0 -16px 14px;border-radius:0}
@media (min-width:660px){ .hero-photo{margin:0 0 14px;border-radius:14px} }
.hero-photo img{aspect-ratio:16/9}
.fig{background:#fffdf9}
.tbl{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:360px}
.tbl th{background:var(--gold);color:var(--gold-ink);text-align:left;padding:8px 10px;font-size:13px}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl caption{caption-side:top;text-align:left;font-weight:700;padding:8px 12px;font-family:"Zen Maru Gothic",sans-serif}
.lesson h3 .sic{margin-right:6px}
.lesson p.bul{padding-left:4px}
/* 豆キャラ */
.bean{display:block;max-width:100%;height:auto}
.gate .bean{width:180px;margin:0 auto}
.hero{position:relative;overflow:hidden}
.hero .bean{position:absolute;right:-10px;bottom:-18px;width:120px;opacity:.95;transform:rotate(-8deg)}
.hero .hz{position:relative;z-index:1;padding-right:110px}
.score .bean{width:150px;margin:0 auto 6px}
.stamp img{width:200px;height:auto;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
.stamp .mk{position:absolute;font-size:64px;transform:translate(70px,-70px)}
.listen .bean{width:36px;display:inline-block;vertical-align:middle;margin-right:6px}
.sd-card .bean{width:70px;float:right;margin:-6px 0 0 8px}
.top .bean{width:34px;margin-right:2px}
@media (prefers-reduced-motion:reduce){ .stamp.show{animation:none} .choice{transition:none} }
/* 2026-09-25 道場に一本化（課・説明・図鑑） */
.sec{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px;font-size:16px;font-weight:900}
.sec .muted{font-weight:400}
.lane-h{display:flex;align-items:center;gap:8px;margin:20px 0 8px}
.lane-h h3{font-size:17px;font-weight:900} .lane-h .muted{margin-left:auto}
.chap .badge.read{background:var(--ok-bg);color:var(--ok);font-weight:700}
.ta{width:100%;font:inherit;font-size:16px;line-height:1.7;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);min-height:110px;resize:vertical}
.inp{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.deep-q{font-size:17px;font-weight:700;line-height:1.6;margin:4px 0 6px;font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif}
.note{font-size:13px;color:var(--ink2);margin:0 0 10px}
.mine{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.mine small{display:block;color:var(--ink2);font-size:12px}
.scored{display:flex;gap:12px;align-items:center;margin-top:8px}
.scored img{width:64px;height:64px;object-fit:contain}
.scored .num{font-size:28px;font-weight:600}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.stamps .s{aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);overflow:hidden}
.stamps .s.on{border:1.5px solid var(--gold);background:var(--paper)} .stamps .s img{width:92%;height:92%;object-fit:contain}
.back{font-size:14px;color:var(--accent);font-weight:700;padding:10px 0;display:inline-block}
.zk{display:grid;grid-template-columns:minmax(92px,1.4fr) repeat(5,1fr);gap:4px;align-items:center;font-size:12px}
.zk .gh{text-align:center;color:var(--ink2);font-size:11px}
.zk .gn{text-align:left;font-size:12.5px;font-weight:700;padding:4px 2px;line-height:1.3}
.zk .gc{height:30px;border-radius:8px}
.lv0{background:var(--line)} .lv1{background:#cfe6dc} .lv2{background:#6fb89a} .lv3{background:var(--accent)}
:root[data-theme="dark"] .lv1{background:#28453a} @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .lv1{background:#28453a} }
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:8px 0}
.legend b{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.slot{margin:10px 0}
.slot .sh{display:flex;align-items:center;gap:8px;font-weight:700}
.slot .sh .lvb{margin-left:auto;font-size:12px;padding:2px 9px;border-radius:999px;color:#fff}
.fact{font-size:14px;margin-top:6px} .fact summary{cursor:pointer;color:var(--ink2)} .fact ul{padding-left:18px;margin:6px 0}
.vid .meta{font-size:13px;color:var(--ink2)}
.vid h3{font-size:17px;margin:18px 0 6px;padding-left:10px;border-left:4px solid var(--gold)}
.vid ul{padding-left:20px;margin:6px 0} .vid li{margin:4px 0}
.lesson .fig svg{min-width:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="stamp" id="stamp"></div>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="home"><span class="ic">🏃</span>今日</button>
  <button data-tab="learn"><span class="ic">📖</span>課</button>
  <button data-tab="zukan"><span class="ic">🗺️</span>図鑑</button>
  <button data-tab="stats"><span class="ic">📈</span>成績</button>
</nav>
<script>
/* ========== 図 ========== */
const FS = `<style>.n{font:700 13px 'Zen Maru Gothic','Noto Sans JP',sans-serif;fill:#2b1d16}.s{font:500 11.5px 'Noto Sans JP',sans-serif;fill:#5d4e44}.m{font:600 13px 'IBM Plex Mono',monospace;fill:#1f5c48}.l{stroke:#b9a48e;stroke-width:2;fill:none}.bx{fill:#fff7e8;stroke:#d8a63a;stroke-width:1.5}.bg{fill:#dff3e6;stroke:#2e7d4f;stroke-width:1.5}.bb{fill:#e3eef6;stroke:#3b6e8f;stroke-width:1.5}.br{fill:#fbe1de;stroke:#b3362e;stroke-width:1.5}</style>`;

let aiVoice = true;
const clipCache = new Map(); let player = null;
function getPlayer(){ if(!player){ player = document.createElement('audio'); player.setAttribute('playsinline',''); player.preload='auto'; document.body.appendChild(player); } return player; }
function unlockPlayer(){ try{ const p = getPlayer(); p.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA='; p.play().catch(()=>{}); }catch(e){} }
function chVoice(ch){ const v = DATA && DATA.audio && DATA.audio.voices; return (v && v[String(ch)]) || (ch%2===1 ? 'z' : 'h'); }
function hasClip(name){ return !!(DATA && DATA.audio && DATA.audio.clips && DATA.audio.clips[name]); }
async function clipUrl(name){
  if(clipCache.has(name)) return clipCache.get(name);
  const url = 'dojo/audio/' + name + '.m4a?v=' + (DATA.audio && DATA.audio.built || ''); clipCache.set(name, url); return url;
}
function prefetch(names){ names.forEach(n => { if(hasClip(n)) { const a = new Audio(); a.preload='auto'; a.src = 'dojo/audio/' + n + '.m4a?v=' + (DATA.audio && DATA.audio.built || ''); } }); }
let playToken = 0;
function stopClip(){ playToken++; try{ const p = getPlayer(); p.pause(); p.currentTime = 0; }catch(e){} }
// 録音があれば再生、無ければ端末の声（fallbackText）
async function say(name, fallbackText, rate){
  if(!voiceOn) return;
  if(aiVoice && KEY && hasClip(name)){
    const my = ++playToken;
    try{
      const url = await clipUrl(name); if(my !== playToken) return;
      const p = getPlayer();
      await new Promise(res => { let done=false; const fin=()=>{ if(!done){ done=true; if(p.onended===fin) p.onended=null; if(p.onerror===fin) p.onerror=null; res(); } }; p.onended = fin; p.onerror = fin; p.src = url; p.play().catch(fin); setTimeout(fin, 60000); const iv = setInterval(()=>{ if(my !== playToken){ clearInterval(iv); fin(); } if(done) clearInterval(iv); }, 100); });
      return;
    }catch(e){ /* 落ちたら端末の声へ */ }
  }
  return speak(fallbackText, rate);
}

let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(freq, t0, dur, type, gain){ const ac = audio(); if(!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.type = type||'sine'; o.frequency.value = freq; g.gain.setValueAtTime(0, ac.currentTime+t0); g.gain.linearRampToValueAtTime(gain||.25, ac.currentTime+t0+.01); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+t0+dur); o.connect(g).connect(ac.destination); o.start(ac.currentTime+t0); o.stop(ac.currentTime+t0+dur+.05); }
function pingPong(){ tone(1046.5, 0, .18); tone(1318.5, .14, .35); }
function buzz(){ tone(150, 0, .35, 'sawtooth', .18); tone(110, .05, .4, 'square', .08); }
function fanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f, i*.12, .3)); tone(1318, .5, .6); }

// 聞き取った言葉 → 0..3（A/B/C/D・1〜4・日本語読み）
function parseChoice(t){ t = (t||'').toLowerCase().replace(/[\s。、．.,]/g,''); if(t.length > 10) return -1; const nm = t.match(/([1-4１-４一二三四]|いち|さん|よん|しばん)/); if(nm){ const k = nm[1]; if(/^(1|１|一|いち)$/.test(k)) return 0; if(/^(2|２|二)$/.test(k)) return 1; if(/^(3|３|三|さん)$/.test(k)) return 2; return 3; } const map = [ [/^(a|エー|えー|えい|1|１|一|いち|いちばん|ａ)/,0], [/^(b|ビー|びー|2|２|二|に|にばん|ｂ)/,1], [/^(c|シー|しー|3|３|三|さん|さんばん|ｃ)/,2], [/^(d|ディー|でぃー|4|４|四|よん|し|よんばん|ｄ)/,3] ]; for(const [re,i] of map){ if(re.test(t)) return i; } const m = t.match(/(a|b|c|d|エー|ビー|シー|ディー|[1-4１-４一二三四])/); if(m){ const k = m[1]; if(/^(a|エー|1|１|一)$/.test(k)) return 0; if(/^(b|ビー|2|２|二)$/.test(k)) return 1; if(/^(c|シー|3|３|三)$/.test(k)) return 2; return 3; } return -1; }
function listenOnce(){ return new Promise(res => { if(!SR){ res(null); return; } try{ stopListen(); recog = new SR(); recog.lang = 'ja-JP'; recog.interimResults = false; recog.maxAlternatives = 5; let done = false; const fin = v => { if(done) return; done = true; res(v); }; recog.onresult = e => { const alts = [...e.results[0]].map(a => a.transcript); for(const a of alts){ const k = parseChoice(a); if(k >= 0){ fin({k, heard:a}); return; } } fin({k:-1, heard:alts[0]||''}); }; recog.onerror = e => fin({k:-1, err:e.error}); recog.onend = () => fin(null); const li = document.getElementById('listen'); if(li) li.hidden = false; recog.start(); }catch(e){ res(null); } }); }
async function keepAwake(){ try{ if(navigator.wakeLock && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }catch(e){} }

function speak(text, rate){ return new Promise(res => { if(!voiceOn || !('speechSynthesis' in window)) return res(); let done=false; const fin=()=>{ if(!done){ done=true; res(); } }; try{ const u = new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate = rate||1.05; const vs = jaVoices(); const v = (voiceName && vs.find(x=>x.name===voiceName)) || vs.find(v=>/Kyoko|O-ren|Hattori|Otoya/i.test(v.name)) || vs[0]; if(v) u.voice=v; u.onend=fin; u.onerror=fin; setTimeout(fin, Math.max(6000, String(text).length*400)); speechSynthesis.speak(u); }catch(e){ fin(); } }); }

/* ========== クラウド保存（合言葉が同じなら端末が変わっても記録が続く） ========== */
const SYNC_URL = 'https://gachirezu.com/dojo/sync.php';
let syncKey = null, syncTimer = null, syncState = { at: null, ok: null };
async function syncInit(pass){ const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('megu-dojo:' + pass + (TEST ? ':test' : ''))); syncKey = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join(''); }
function localState(){ return { history: S.get('history', []), mastery: S.get('mastery', {}), read: S.get('read', {}) }; }
function mergeState(a, b){ // 両方の記録を合わせる（消さない）
  const hk = h => `${h.at}|${h.mode}|${h.ch}|${h.ok}/${h.n}`; const seen = new Set(); const history = [];
  for(const h of [...(a.history||[]), ...(b.history||[])]){ const k = hk(h); if(!seen.has(k)){ seen.add(k); history.push(h); } }
  history.sort((x,y) => (x.at||'').localeCompare(y.at||''));
  const mastery = { ...(a.mastery||{}) };
  for(const [k,v] of Object.entries(b.mastery||{})){ const cur = mastery[k]; if(!cur) mastery[k] = v; else mastery[k] = { ok: Math.max(cur.ok||0, v.ok||0), ng: Math.max(cur.ng||0, v.ng||0), last: ((v.at||'') >= (cur.at||'')) ? v.last : cur.last, at: (v.at||'') >= (cur.at||'') ? v.at : cur.at }; }
  const read = { ...(a.read||{}) }; for(const [k,v] of Object.entries(b.read||{})){ if(!read[k] || v > read[k]) read[k] = v; }
  return { history: history.slice(-500), mastery, read };
}
async function syncPull(){ if(!syncKey) return; try{ const r = await fetch(`${SYNC_URL}?k=${syncKey}`, { cache:'no-store' }); if(!r.ok) throw new Error(r.status); const remote = await r.json(); if(remote && typeof remote === 'object'){ const m = mergeState(localState(), remote); S._quiet = true; S.set('history', m.history); S.set('mastery', m.mastery); S.set('read', m.read); S._quiet = false; } syncState = { at: new Date(), ok: true }; }catch(e){ syncState = { at: new Date(), ok: false, err: String(e) }; } }
function syncPush(){ if(!syncKey) return; clearTimeout(syncTimer); syncTimer = setTimeout(async () => { try{ const body = JSON.stringify({ ...localState(), updated: new Date().toISOString(), device: navigator.userAgent.slice(0,60) }); const r = await fetch(`${SYNC_URL}?k=${syncKey}`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body }); syncState = { at: new Date(), ok: r.ok }; }catch(e){ syncState = { at: new Date(), ok: false, err: String(e) }; } const el = document.getElementById('sync-st'); if(el) el.textContent = syncLabel(); }, 1500); }
function syncLabel(){ if(!syncState.at) return '☁️ 未同期'; const t = syncState.at.toTimeString().slice(0,5); return syncState.ok ? `☁️ クラウドに保存済み ${t}` : `⚠️ クラウド保存に失敗 ${t}（端末には残っている）`; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') syncPush(); });

let RUN = null;
function pickQuestions(opt){
  const m = mastery(); let pool = allQ();
  if(opt.keys){ const set = new Set(opt.keys); return shuffle(pool.filter(q=>set.has(q.key))); }
  if(opt.mode==='chapter') pool = pool.filter(q=>q.ch===opt.ch);
  else if(opt.mode==='wrong') pool = pool.filter(q => m[q.key] && !m[q.key].last);
  else if(opt.mode==='unseen') pool = pool.filter(q => !m[q.key]);
  pool = shuffle(pool);
  if(opt.mode==='exam'){ // 章から均等に35問
    const per = {}; pool.forEach(q => (per[q.ch] = per[q.ch]||[]).push(q));
    const out = []; const chs = Object.keys(per); let i = 0;
    while(out.length < DATA.exam.questions && chs.some(c=>per[c].length)){ const c = chs[i % chs.length]; if(per[c].length) out.push(per[c].shift()); i++; }
    return shuffle(out);
  }
  if(opt.mode==='chapter') return pool;
  return pool.slice(0, 10);
}

/* ========== 課・説明する1問・図鑑（2026-09-25 カンブリアを道場に一本化） ==========
   メグ「道場のデザインが良かった。全部それに。カンブリアって名前やめて、道場に一本化して」
   棚は4つ: 📺動画（Yパパ・太郎）／🌏基礎（世界・経済）／🔭学問（宇宙→物理→量子）／🏢会社（自分で頼んだ会社だけ）

   書くのは inbox/quiz_answers/<JSTの日付>.json（読んだ課・説明の答え）と inbox/queue（会社を頼む）だけ。仕様: knowledge/学習/学習OS.md */
const GH = { repo:'meyjiro/claude-context', branch:'main' };
const PAT = (() => { try{ return localStorage.getItem('gh_pat') || ''; }catch(e){ return ''; } })();
const ghp = p => encodeURIComponent(p).replace(/%2F/g, '/');
const ghEnc = t => btoa(unescape(encodeURIComponent(t)));
const ghDec = b => decodeURIComponent(escape(atob(String(b).replace(/\n/g, ''))));
async function ghApi(path, method, body, raw){
  const o = { method: method||'GET', cache:'no-store', headers:{ Authorization:'token '+PAT, Accept: raw ? 'application/vnd.github.raw' : 'application/vnd.github.v3+json' } };
  if(body){ o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  const r = await fetch('https://api.github.com' + path, o);

}
const ghText = (path, repo) => PAT ? ghApi(`/repos/${repo||GH.repo}/contents/${ghp(path)}`, 'GET', null, true).catch(() => null) : Promise.resolve(null);
const ghJson = async (path, repo) => { const t = await ghText(path, repo); try{ return t ? JSON.parse(t) : null; }catch(e){ return null; } };

async function ghPut(path, mutate, message){   // JSON を読み→直し→書く（同時に書かれたら1回だけやり直す）
  for(let a=0; a<2; a++){
    const f = await ghApi(`/repos/${GH.repo}/contents/${ghp(path)}?ref=${GH.branch}`);
    let j = {}; if(f && f.content != null){ try{ j = JSON.parse(ghDec(f.content)); }catch(e){} }
    mutate(j); j.at = new Date().toISOString();
    try{ await ghApi(`/repos/${GH.repo}/contents/${ghp(path)}`, 'PUT', { message, content: ghEnc(JSON.stringify(j, null, 1)), branch: GH.branch, ...(f ? { sha: f.sha } : {}) }); return j; }
    catch(e){ if(a===1 || !/409|422/.test(e.message)) throw e; }
  }
}

function laneOf(x){ if(x.lane) return x.lane; if(x.track==='V') return '動画'; const k = String(x.key||''); if(k.startsWith('stairs:') || x.track==='B') return '学問'; if(x.track==='K' || /教科書\/K\//.test(k)) return '会社'; return '基礎'; }
const SLOT = {1:'歴史', 2:'今', 3:'産業', 4:'損得', 5:'ニュース'};
const LVN = ['まだ', '見た', '思い出せる', '説明できる'];

let L = { loaded:false, loading:null, zk:null, quiz:null, day:null, read:{}, scores:[], stamps:null, videos:[] };
function learnLoad(){
  if(L.loading) return L.loading;
  if(!PAT){ L.loaded = true; return Promise.resolve(); }
  L.loading = (async () => {
    const days = []; for(let i=6; i>=0; i--) days.push(new Date(Date.now()-i*864e5).toLocaleDateString('sv-SE', { timeZone:'Asia/Tokyo' }));
    const [zk, mj, sc, st, ...ds] = await Promise.all([
      ghJson('knowledge/学習/図鑑.json'), ghJson('inbox/morning.json'),
      ghText('knowledge/学習/成績.jsonl').then(t => (t||'').trim().split('\n').filter(Boolean).map(l => { try{ return JSON.parse(l); }catch(e){ return null; } }).filter(Boolean)),
      fetch('img/stamps/stamps.json').then(r => r.ok ? r.json() : null).catch(() => null),
      ...days.map(d => ghJson(`inbox/quiz_answers/${d}.json`)) ]);
    L.zk = zk; L.quiz = (mj && mj.quiz) || null; L.scores = sc || []; L.stamps = st;
    L.read = {}; ds.forEach(j => { if(j && j.lessons) Object.assign(L.read, j.lessons); });
    const qd = (L.quiz && L.quiz.date) || jst(); L.day = ds[days.indexOf(qd)] || await ghJson(`inbox/quiz_answers/${qd}.json`) || {};
    L.loaded = true;
    // 動画は後から（索引 cards/index.jsonl が 800KB ある）。Yパパ・太郎の本編だけ、新しい順
    ghText('cards/index.jsonl', 'meyjiro/toushi-data').then(t => {
      L.videos = String(t||'').split('\n').map(l => { try{ return JSON.parse(l); }catch(e){ return null; } })
        .filter(v => v && (v.ch==='ypapa' || v.ch==='monozukuri') && v.vid && v.date)
        .map(v => ({ ch:v.ch, title:v.title, date:String(v.date), path:`cards/${v.ch}/${v.date}_${v.vid}.md` }))
        .sort((a,b) => b.date.localeCompare(a.date));
      if(!VIEW && (TAB==='learn' || TAB==='home')) render(); });
  })().catch(e => { L.err = e.message; L.loaded = true; });
  return L.loading;
}
function allLessons(){ const z = L.zk || {}; const seen = new Set(); return (z.lessons||[]).concat(z.stories||[]).filter(x => x && x.key && !seen.has(x.key) && seen.add(x.key)); }
function isRead(x){ const r = L.read[x.key] || (x.path && L.read[x.path]); return !!((r && r.done) || x.read); }
function nextIn(lane){ return allLessons().find(x => laneOf(x)===lane && !isRead(x) && x.kind!=='html'); }
function stampSrc(score, seed){ const cfg = L.stamps || {}; const list = score==null ? (cfg.extra||[]) : ((cfg.score||{})[String(score)]||[]); if(!list.length) return ''; let h = 0; for(const c of String(seed)) h = (h*31 + c.charCodeAt(0)) >>> 0; return `img/stamps/${list[h % list.length]}.png`; }
function stampList(){ const base = ((L.zk && L.zk.stamps)||[]).map(s => Object.assign({}, s)); const keys = new Set(base.map(s => s.key));
  Object.entries(L.read).sort((a,b) => String(a[1]&&a[1].at).localeCompare(String(b[1]&&b[1].at))).forEach(([k,v]) => { if(!v || !v.done || keys.has(k) || (v.path && keys.has(v.path))) return; base.push({ key:k, date:jst(), score: v.skip ? 3 : null }); keys.add(k); });
  return base; }
function deepItem(){ const it = (L.quiz && L.quiz.items) || []; const ans = (L.day && L.day.answers) || {}; return it.find(x => !(ans[x.id] && (ans[x.id].text || ans[x.id].audio))) || it[0] || null; }

/* ── 今日タブに差し込む部分 */
function homeLearnHtml(){
  if(!PAT) return `<div class="card" style="margin-top:18px"><b>📖 課・説明する1問・図鑑</b><p class="muted" style="margin:6px 0 0">この端末ではまだ読めない。<a href="./">ダッシュボード</a>を一度開いてから戻ると出る。</p></div>`;
  if(!L.loaded){ learnLoad().then(() => { if(!VIEW && TAB==='home') render(); }); return `<p class="muted" style="margin-top:18px">📖 課と説明する1問を読み込み中…</p>`; }
  const picks = ['動画','基礎','学問','会社'].map(nextIn).filter(Boolean);
  const v = nextIn('動画') ? null : L.videos[0];   // 振り返りの課（Yパパの過去回を今につなぐ課・1日1本）があればそれ。無ければ最新の回
  const pickH = picks.map(x => lessonRow(x)).join('') + (v ? `<button class="chap" data-video="${esc(v.path)}"><span class="em">📺</span><span><span class="t">${esc(vTitle(v))}</span><br><span class="m">${v.ch==='ypapa'?'Yパパ':'ものづくり太郎'} ・ ${md2(v.date)} ・ 問いは10問に混ざる</span></span><span class="badge">見る</span></button>` : '');
  const it = deepItem(); let deep = '';
  if(it){
    const qd = (L.quiz && L.quiz.date) || jst(); const a = ((L.day && L.day.answers) || {})[it.id]; const sc = L.scores.find(r => r.id===it.id && r.date===qd && r.score!=null);
    deep = `<div class="deep-q">${esc(it.text||'')}</div>${it.note ? `<p class="note">${esc(it.note)}</p>` : ''}`;
    if(sc) deep += `<div class="mine"><small>自分の答え</small>${esc((a&&a.text) || sc.answer || '')}</div><div class="scored">${stampSrc(sc.score, it.id+':'+qd) ? `<img src="${stampSrc(sc.score, it.id+':'+qd)}" alt="">` : ''}<div><span class="num">${sc.score}</span> / 3${sc.miss ? `<div class="muted">抜け: ${esc(sc.miss)}</div>` : ''}</div></div>`;
    else if(a && (a.text || a.audio) && !L.editDeep) deep += `<div class="mine"><small>自分の答え</small>${a.text ? esc(a.text) : '🎤 録音'}</div><p class="muted">夜に採点が付く</p><button class="btn sub" id="deep-edit">書き直す</button>`;
    else deep += `<textarea class="ta" id="deep-ta" placeholder="30秒でちょっちに説明するつもりで。話し言葉でいい">${esc((a&&a.text)||'')}</textarea><div class="row" style="margin-top:10px"><button class="btn" id="deep-save" data-id="${esc(it.id)}">保存</button></div>`;
  } else deep = `<p class="muted">今日の問いはまだ届いていない</p>`;
  const Ls = stampList(); const n = Ls.length; const no = n ? Math.floor((n-1)/20)+1 : 1; const cur = Ls.slice((no-1)*20);
  const cells = Array.from({ length:20 }, (_, i) => { const s = cur[i]; const src = s && stampSrc(s.score, s.key+':'+s.date); return s ? `<div class="s on">${src ? `<img src="${src}" alt="">` : '✓'}</div>` : `<div class="s">${i+1}</div>`; }).join('');
  return `<div class="sec">📖 今日の1課 <span class="muted">好きなのを1つ・何課でも</span></div><div class="grid">${pickH || '<p class="muted">次の課を用意している</p>'}</div>
    <button class="btn sub" data-go="learn" style="margin-top:10px">課の棚を全部見る →</button>
    <div class="sec">🗣 説明する1問</div><div class="card">${deep}</div>
    <div class="sec">🎖 スタンプカード <span class="muted">No.${no} ・ 課を1つ読むと1個</span></div><div class="card"><div class="stamps">${cells}</div></div>`;
}
function lessonRow(x){
  const r = isRead(x); const lane = laneOf(x);
  return `<button class="chap" data-lesson="${esc(x.key)}"><span class="em">${laneIc(lane)}</span><span><span class="t">${esc(x.title||x.key)}</span><br><span class="m">${esc(lane)}${x.card ? ' ・ '+esc(x.card) : ''}${x.minutes ? ` ・ ${esc(String(x.minutes))}分` : ''}</span></span><span class="badge ${r?'read':''}">${r ? '読んだ' : '読む'}</span></button>`;
}
function vTitle(v){ return v.title || ((v.ch==='ypapa'?'Yパパ':'ものづくり太郎') + ' ' + md2(v.date)); }

/* ── 課タブ（4つの棚） */
function renderLearn(){
  if(!PAT){ app.innerHTML = header() + homeLearnHtml(); return; }
  if(!L.loaded){ app.innerHTML = header() + '<p class="muted">読み込み中…</p>'; learnLoad().then(() => { if(!VIEW && TAB==='learn') render(); }); return; }
  const ls = allLessons();
  const sec = LANES.map(ln => {
    let rows = '';
    if(ln.k === '動画'){ const vs = ls.filter(x => laneOf(x)==='動画'); rows = (vs.length ? `<p class="muted" style="margin:0">🔁 振り返りの課（昔の回を、今どうなったかまで追う・1日1本）</p>${vs.map(lessonRow).join('')}<p class="muted" style="margin:8px 0 0">🆕 最近の回</p>` : '') + L.videos.slice(0, 14).map(v => `<button class="chap" data-video="${esc(v.path)}"><span class="em">${v.ch==='ypapa'?'🎙️':'🏭'}</span><span><span class="t">${esc(v.title || (v.ch==='ypapa'?'Yパパ':'ものづくり太郎')+' '+md2(v.date))}</span><br><span class="m">${v.ch==='ypapa'?'Yパパ':'ものづくり太郎'} ・ ${md2(v.date)}</span></span><span class="badge">見る</span></button>`).join('') || '<p class="muted">読み込み中…</p>'; }
    else { const xs = ls.filter(x => laneOf(x)===ln.k); rows = xs.map(x => x.kind==='html' ? `<button class="chap" data-html="${esc(x.path)}"><span class="em">${ln.ic}</span><span><span class="t">${esc(x.title||x.key)}</span><br><span class="m">${esc(ln.k)}</span></span><span class="badge">読む</span></button>` : lessonRow(x)).join('') || '<p class="muted">まだ無い</p>'; }
    const extra = ln.k === '会社' ? `<div class="card" style="margin-top:10px"><b>🏢 調べたい会社を頼む</b><p class="muted" style="margin:4px 0 8px">名前を入れると、その会社だけ深掘りの課になる（細かい数字は覚えさせない）</p><input class="inp" id="co-name" placeholder="例: 東京エレクトロン"><button class="btn" id="co-send" style="margin-top:8px">頼む</button></div>` : '';
    const read = ln.k==='動画' ? '' : `${ls.filter(x => laneOf(x)===ln.k && isRead(x)).length} / ${ls.filter(x => laneOf(x)===ln.k).length}`;
    return `<div class="lane-h"><span style="font-size:24px">${ln.ic}</span><h3>${esc(ln.k)}</h3><span class="muted num">${read}</span></div><p class="muted" style="margin:-4px 0 8px">${esc(ln.d)}</p><div class="grid">${rows}</div>${extra}`;
  }).join('');
  app.innerHTML = header() + sec;
  bindLearn();
}

/* ── 課を読む */
const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<span class="hl">$1</span>').replace(/\[\[(.+?)\]\]/g, '<span class="nb">$1</span>').replace(/\{\{(.+?)\}\}/g, '<b>$1</b>').replace(/\(\((.+?)\)\)/g, ' <span class="muted">← $1</span>');
async function openLesson(key){
  const x = allLessons().find(y => y.key===key) || { key };
  let path = x.path; if(!path){ const m = String(key).match(/^([A-Z])(\d+)$/); if(m) path = `knowledge/学習/教科書/${m[1]}/${String(m[2]).padStart(2,'0')}.json`; }
  app.innerHTML = header() + '<p class="muted">読み込み中…</p>';
  const J = path ? await ghJson(path) : null; if(!J){ app.innerHTML = header() + '<p class="muted">この課はまだ書かれていない</p><button class="back" data-back>‹ 戻る</button>'; bindLearn(); return; }
  J.key = key; J.lane = laneOf(x); VIEW = { type:'lesson', L:J, x }; render(); window.scrollTo(0,0);
}
function viewLesson(){
  const J = VIEW.L, x = VIEW.x; const sv = L.read[J.key] || (x.path && L.read[x.path]) || {};
  const fig = f => !f ? '' : f.svg ? `<div class="fig">${f.svg}${f.cap ? `<div class="cap">${esc(f.cap)}</div>` : ''}</div>` : '';
  const terms = (J.cue||[]).filter(c => c.t==='term');
  app.innerHTML = header() + `<button class="back" data-back>‹ 戻る</button><div class="lesson">
    <span class="pill on">${laneIc(J.lane)} ${esc(J.lane)}</span>${J.card ? ` <span class="pill">${esc(J.card)}</span>` : ''} <span class="muted">${esc(String(J.minutes||8))}分</span>
    <h2>${esc(J.title||'')}</h2><p class="lead">${inl(J.aim||'')}</p>
    ${J.video ? `<p class="muted" style="margin:-6px 0 12px">📺 元の動画: ${esc(J.video.title||'')}（${md2(J.video.date)}）${J.video.url ? ` ・ <a href="${esc(J.video.url)}" target="_blank" rel="noopener">YouTube</a>` : ''}${J.as_of ? ` ・ ${md2(J.as_of)}時点で確認` : ''}</p>` : ''}
    ${sv.done ? '' : `<button class="btn sub" id="knows">もう知ってる（3問で確かめて飛ばす）</button>`}
    ${(J.pretest||[]).length ? `<div class="co tip"><span class="ci">🤔</span><div><b>読む前に考える（外れてOK）</b>${J.pretest.map(p => inl(p)).join('<br>')}</div></div>` : ''}
    ${(J.sections||[]).map(sc => `<h3>${esc(sc.h||'')}</h3>${(sc.p||[]).map(p => `<p>${inl(p)}</p>`).join('')}${fig(sc.fig)}${(sc.figs||[]).map(fig).join('')}`).join('')}
    ${terms.length ? `<h3>ことば</h3><div class="terms">${terms.map(c => `<div class="term"><b>${esc(c.h)}</b>　${inl(c.b)}</div>`).join('')}</div>` : ''}
    <div class="keys"><h4>覚える3行</h4><ol>${(J.summary||[]).map(s => `<li>${inl(s)}</li>`).join('')}</ol></div>
    <div class="card"><b>自分の3行</b><p class="muted" style="margin:2px 0 6px">自分の言葉で。写さない</p><textarea class="ta" id="my3">${esc(sv.my3||'')}</textarea>
      <p class="muted" style="margin:10px 0 4px">明日の自分に出す問いを1つ（なくてもいい）</p><input class="inp" id="myq" value="${esc(sv.myq||'')}">
      <button class="btn" id="done" style="margin-top:12px" ${sv.done ? 'disabled' : ''}>${sv.done ? 'この課は読んだ' : '読んだ → スタンプ +1'}</button><p class="muted" id="done-st"></p></div>
    ${J.sources ? `<p class="muted">出典: ${esc(J.sources)}</p>` : ''}</div>`;
  bindLearn();
}
function lessonQid(J, i){ const q = (J.quick||[])[i] || {}; if(q.id) return q.id; return /^[ABCK]$/.test(J.track) && typeof J.no === 'number' ? `${J.track}${J.no}-q${i+1}` : `${J.key}#q${i+1}`; }
async function saveLessonDone(J, extra){
  const x = VIEW && VIEW.x || {}; const key = x.path && /\//.test(x.key) ? x.key : J.key;
  const rec = Object.assign({ track:J.track, no:J.no, done:true, at:new Date().toISOString() }, extra); if(String(key).includes('/')) rec.path = key;
  await ghPut(`inbox/quiz_answers/${jst()}.json`, j => { j.date = j.date || jst(); j.lessons = j.lessons || {}; j.lessons[key] = rec; if(extra && extra.self){ j.self = Object.assign(j.self||{}, extra.self); delete rec.self; } }, `課を読んだ ${key}`);
  L.read[key] = rec;
}
function viewKnows(){
  const J = VIEW.L; const qs = (J.quick||[]).slice(0,3); const i = VIEW.i||0;
  if(i >= qs.length){ const ok = VIEW.ok||0;
    app.innerHTML = header() + `<button class="back" data-back>‹ 戻る</button><div class="card" style="text-align:center"><h2 style="font-size:22px;font-weight:900">${ok===qs.length ? '全部言えた' : `${ok} / ${qs.length} 言えた`}</h2>
      <p class="muted">${ok===qs.length ? '課を読んだことにして、スタンプを押した' : '1つでも「まだ」なら、読んでおくのがおすすめ'}</p>
      <button class="btn" data-lesson="${esc(J.key)}">${ok===qs.length ? '課の棚に戻る' : '課を読む'}</button></div>`;
    if(ok===qs.length && !VIEW.saved){ VIEW.saved = true; const self = {}; qs.forEach((_, k) => self[lessonQid(J,k)] = 3); saveLessonDone(J, { skip:true, self }).catch(e => alert('保存できなかった: '+e.message)); }
    const b = app.querySelector('[data-lesson]'); b.onclick = () => { if(ok===qs.length){ VIEW = null; setTab('learn'); } else { VIEW = { type:'lesson', L:J, x:VIEW.x }; render(); } };
    app.querySelector('[data-back]').onclick = () => { VIEW = null; render(); }; return; }
  const q = qs[i];
  app.innerHTML = header() + `<button class="back" data-back>‹ 戻る</button><div class="qtop"><span class="num">${i+1} / ${qs.length}</span><div class="bar"><i style="width:${i/qs.length*100}%"></i></div></div>
    <div class="q">${esc(q.q || q.text || '')}</div>${VIEW.show ? `<div class="fb ok"><b>答え</b>${esc(q.a || q.answer_key || q.answer || '')}</div><div class="row"><button class="btn sub" id="k-no">まだ</button><button class="btn" id="k-ok">言えた</button></div>` : `<button class="btn" id="k-show">答えを見る</button>`}`;
  const nx = ok => { VIEW.i = i+1; VIEW.show = false; VIEW.ok = (VIEW.ok||0) + (ok?1:0); render(); };
  const sh = app.querySelector('#k-show'); if(sh) sh.onclick = () => { VIEW.show = true; render(); };
  const ko = app.querySelector('#k-ok'); if(ko) ko.onclick = () => nx(true);
  const kn = app.querySelector('#k-no'); if(kn) kn.onclick = () => nx(false);
  app.querySelector('[data-back]').onclick = () => { VIEW = { type:'lesson', L:J, x:VIEW.x }; render(); };
}

/* ── 動画のまとめを読む（toushi-data/cards/*.md） */
function mdLite(src){ let out = '', inL = false; for(let l of String(src).split('\n')){ const li = l.match(/^\s*[-*・]\s+(.*)$/);
  if(li){ if(!inL){ out += '<ul>'; inL = true; } out += `<li>${inl(li[1])}</li>`; continue; } if(inL){ out += '</ul>'; inL = false; }
  const h = l.match(/^#{1,4}\s+(.*)$/); if(h) out += `<h3>${esc(h[1])}</h3>`; else if(l.trim()) out += `<p>${inl(l)}</p>`; } if(inL) out += '</ul>'; return out; }
async function openVideo(path){
  app.innerHTML = header() + '<p class="muted">読み込み中…</p>';
  const t = await ghText(path, 'meyjiro/toushi-data'); if(!t){ app.innerHTML = header() + '<p class="muted">読めなかった</p><button class="back" data-back>‹ 戻る</button>'; bindLearn(); return; }
  const fm = {}; let body = t; const m = t.match(/^---\n([\s\S]*?)\n---\n?/); if(m){ body = t.slice(m[0].length); m[1].split('\n').forEach(l => { const k = l.match(/^(\w+):\s*(.*)$/); if(k) fm[k[1]] = k[2].replace(/^"|"$/g, ''); }); }
  VIEW = { type:'video', fm, body }; render(); window.scrollTo(0,0);
}
function viewVideo(){ const { fm, body } = VIEW;
  app.innerHTML = header() + `<button class="back" data-back>‹ 戻る</button><div class="vid"><span class="pill on">📺 動画</span> <span class="pill">${fm.channel==='ypapa'?'Yパパ':fm.channel==='monozukuri'?'ものづくり太郎':esc(fm.channel||'')}</span>
    <h2 style="font-size:22px;font-weight:900;margin:8px 0 4px">${esc(fm.title||'')}</h2><p class="meta">${md2(fm.date)}${fm.url ? ` ・ <a href="${esc(fm.url)}" target="_blank" rel="noopener">YouTubeで見る</a>` : ''}</p>
    <div class="co tip"><span class="ci">💡</span><div><b>この回の問い</b>根本の考え方だけを問いにして、今日の10問に混ぜる（細かい数字は出さない）</div></div>${mdLite(body)}</div>`;
  bindLearn(); }

/* ── 図鑑タブ（14枚×5枠） */
function renderZukan(){
  if(!PAT){ app.innerHTML = header() + homeLearnHtml(); return; }
  if(!L.loaded){ app.innerHTML = header() + '<p class="muted">読み込み中…</p>'; learnLoad().then(() => { if(!VIEW && TAB==='zukan') render(); }); return; }
  const z = L.zk; if(!z || !z.cards){ app.innerHTML = header() + '<p class="muted">図鑑のデータがまだ無い</p>'; return; }
  const colored = 70 - (+((z.counts||{})['0'])||0);
  const rows = (z.order||Object.keys(z.cards)).map(c => { const C = z.cards[c]; if(!C) return ''; return `<button class="gn" data-card="${esc(c)}">${esc(c)}</button>${[1,2,3,4,5].map(s => `<button class="gc lv${(C.slots[String(s)]||{}).level||0}" data-card="${esc(c)}" aria-label="${esc(c+' '+SLOT[s])}"></button>`).join('')}`; }).join('');
  app.innerHTML = header() + `<div class="card"><div style="display:flex;align-items:baseline;gap:8px"><h2 style="font-size:20px;font-weight:900">🗺️ 図鑑</h2><span class="muted" style="margin-left:auto">色の付いたマス <span class="num" style="font-size:22px;color:var(--ink)">${colored}</span> / 70</span></div>
    <div class="legend">${[0,1,2,3].map(l => `<span><b class="lv${l}"></b>${LVN[l]}</span>`).join('')}</div>
    <div class="zk"><div></div>${[1,2,3,4,5].map(s => `<div class="gh">${SLOT[s]}</div>`).join('')}${rows}</div>
    <p class="muted" style="margin:10px 0 0">見た＝課を読んだ・問いに触れた ／ 思い出せる＝2点以上 ／ 説明できる＝別の日に3点を2回</p></div>
    <a class="btn sub" href="world.html" style="margin-top:12px;text-decoration:none">🌍 世界地図で見る</a>`;
  app.querySelectorAll('[data-card]').forEach(b => b.onclick = () => { VIEW = { type:'card', name:b.dataset.card }; render(); window.scrollTo(0,0); });
}
function viewCard(){
  const name = VIEW.name; const C = L.zk.cards[name]; const ls = allLessons();
  const lvc = ['var(--ink2)', '#6fa58c', '#3e8e6c', 'var(--accent)'];
  const slots = [1,2,3,4,5].map(s => { const S = C.slots[String(s)]||{}; const lv = S.level||0; const body = String(S.body||'').replace(/[🔴🟢🟡🟠]\s*/gu, '').trim();
    const first = (body.split('\n').find(l => l.trim() && !/^（/.test(l.trim()))||'').replace(/^\s*(?:[-・]|\d+\.)\s*/, '').replace(/\*\*/g, '');
    const mine = (S.answers||[]).map(x => `<div class="mine"><small>${md2(x.date)} ・ ${esc(x.q||'')}</small>${x.a ? esc(String(x.a).slice(0,120)) : ''}${x.score!=null ? ` ・ <b class="num">${x.score}</b>/3` : ''}</div>`).join('');
    const les = ls.filter(x => x.card===name && +x.slot===s).map(lessonRow).join('');
    return `<div class="card slot"><div class="sh"><span>${s}. ${SLOT[s]}</span><span class="lvb" style="background:${lvc[lv]}">${LVN[lv]}</span></div>
      ${body && !/^（夜の巡回が/.test(body) ? `<details class="fact"><summary>${esc(first.length>70 ? first.slice(0,70)+'…' : first)}</summary>${mdLite(body)}</details>` : '<p class="muted">事実はまだ無い</p>'}
      ${mine}${les ? `<div class="grid" style="margin-top:8px">${les}</div>` : ''}</div>`; }).join('');
  app.innerHTML = header() + `<button class="back" data-back>‹ 図鑑</button><h2 style="font-size:22px;font-weight:900;margin:4px 0 10px">${esc(name)}</h2>${slots}`;
  bindLearn();
}
const LV_VIEWS = { lesson: viewLesson, knows: viewKnows, video: viewVideo, card: viewCard };

/* ── 操作 */
function bindLearn(){
  app.querySelectorAll('[data-lesson]').forEach(b => { if(!b.onclick) b.onclick = () => openLesson(b.dataset.lesson); });
  app.querySelectorAll('[data-video]').forEach(b => b.onclick = () => openVideo(b.dataset.video));
  app.querySelectorAll('[data-html]').forEach(b => b.onclick = async () => { const t = await ghText(b.dataset.html); if(!t) return alert('読めなかった'); const w = window.open('', '_blank'); if(w){ w.document.write(t); w.document.close(); } });
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => setTab(b.dataset.go));
  app.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { VIEW = null; render(); window.scrollTo(0,0); });
  const ds = app.querySelector('#deep-save'); if(ds) ds.onclick = async () => { const text = (app.querySelector('#deep-ta').value||'').trim(); if(!text) return; ds.disabled = true; ds.textContent = '保存中…';
    const qd = (L.quiz && L.quiz.date) || jst(); try{ L.day = await ghPut(`inbox/quiz_answers/${qd}.json`, j => { j.date = j.date || qd; if(!j.quiz && L.quiz) j.quiz = L.quiz; j.answers = j.answers || {}; j.answers[ds.dataset.id] = { text, at:new Date().toISOString() }; }, `説明する1問 ${ds.dataset.id}`); L.editDeep = false; render(); }
    catch(e){ ds.disabled = false; ds.textContent = '保存'; alert('保存できなかった: '+e.message); } };
  const de = app.querySelector('#deep-edit'); if(de) de.onclick = () => { L.editDeep = true; render(); };
  const dn = app.querySelector('#done'); if(dn && VIEW && VIEW.type==='lesson') dn.onclick = async () => { dn.disabled = true; dn.textContent = '保存中…';
    try{ await saveLessonDone(VIEW.L, { my3: app.querySelector('#my3').value, myq: app.querySelector('#myq').value }); dn.textContent = 'この課は読んだ'; app.querySelector('#done-st').textContent = 'スタンプ +1。明日から、この課の問いが10問に混ざる'; fanfare(); }
    catch(e){ dn.disabled = false; dn.textContent = '読んだ → スタンプ +1'; alert('保存できなかった: '+e.message); } };
  const kn = app.querySelector('#knows'); if(kn) kn.onclick = () => { VIEW = { type:'knows', L:VIEW.L, x:VIEW.x, i:0, ok:0 }; render(); window.scrollTo(0,0); };
  const cs = app.querySelector('#co-send'); if(cs) cs.onclick = async () => { const name = (app.querySelector('#co-name').value||'').trim(); if(!name) return; cs.disabled = true;
    const d = new Date(); const p2 = n => String(n).padStart(2,'0'); const stamp = `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
    try{ await ghApi(`/repos/${GH.repo}/contents/${ghp(`inbox/queue/${stamp}_company.md`)}`, 'PUT', { message:`会社を頼む ${name}`, branch:GH.branch, content: ghEnc(`at: ${d.toLocaleString('sv-SE',{timeZone:'Asia/Tokyo'}).slice(0,16)}\nkind: 学び\ntype: 会社\n\n${name} を会社の課にしてほしい（道場から）。深掘りするのはこの会社だけ。細かい数字は覚えさせない`) });
      cs.textContent = '頼んだ（夜に課になる）'; }
    catch(e){ cs.disabled = false; alert('送れなかった: '+e.message); } };
}

/* ========== 入口 ========== */
async function boot(){
  try{ const r = await fetch('dojo/data.json?v=' + Date.now()); DATA = await r.json(); }catch(e){ app.innerHTML = `<div class="gate"><img class="bean" src="dojo/img/bean_shock.png" alt=""><p>データが読めなかった。電波を確認してもう一度開いて。</p></div>`; return; }
  await syncInit('megu'); await syncPull(); syncPush(); start();
}
function start(){ tabs.hidden = false; const h = location.hash.slice(1); setTab(['learn','zukan','stats'].includes(h) ? h : 'home'); }   // #learn・#zukan で開ける（ダッシュボードから）
boot();
</script>
</body>
