<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e8938f">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>とくい・にがて マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#fdfbf7; --card:#ffffff; --ink:#3d3a44; --sub:#8b8593; --line:#ece6dd;
  --accent:#e8938f; --accent-soft:#fdeeed;
  --c1:#e8938f; --c2:#dda355; --c3:#6faf87; --c4:#6f9ec4; --c5:#a58ac4; --c6:#d489ac;
  --c1s:#fdeeed; --c2s:#fbf1e2; --c3s:#e9f5ee; --c4s:#e9f1f8; --c5s:#f2edf8; --c6s:#fbecf3;
  --ok:#5a9c78; --warn:#c98a3c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#211f26; --card:#2b2932; --ink:#eee9f0; --sub:#a49daf; --line:#3a3743;
  --accent:#f0a5a1; --accent-soft:#3b2b2c;
  --c1s:#3b2b2c; --c2s:#3a3126; --c3s:#26362d; --c4s:#25323d; --c5s:#332c3f; --c6s:#3a2b35;
  --ok:#7dc3a0; --warn:#e0aa6a;
}}
:root[data-theme="dark"]{
  --bg:#211f26; --card:#2b2932; --ink:#eee9f0; --sub:#a49daf; --line:#3a3743;
  --accent:#f0a5a1; --accent-soft:#3b2b2c;
  --c1s:#3b2b2c; --c2s:#3a3126; --c3s:#26362d; --c4s:#25323d; --c5s:#332c3f; --c6s:#3a2b35;
  --ok:#7dc3a0; --warn:#e0aa6a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  font-size:16px;line-height:1.9;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 120px}
h1{font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:.02em}
.lede{color:var(--sub);font-size:13.5px;line-height:1.85;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;margin-bottom:14px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700;
  font-family:inherit;background:var(--accent);color:#fff;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:500;font-size:14px}

/* 進捗 */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;margin:-18px -16px 14px;padding-left:16px;padding-right:16px}
.bar .t{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub);margin-bottom:6px}
.bar .t b{font-size:12.5px;color:var(--ink)}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .35s cubic-bezier(.3,1,.4,1)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* 設問 */
.qno{font-size:11px;letter-spacing:.1em;color:var(--sub);font-weight:700;margin-bottom:6px}
.q{font-size:18px;font-weight:700;line-height:1.75;margin:0 0 4px}
.qsub{font-size:13px;color:var(--sub);margin:6px 0 0;line-height:1.8}
.figure{margin:16px 0 4px;text-align:center}
.figure svg{max-width:100%;height:auto}
.choices{display:grid;gap:9px;margin-top:16px}
.choices.grid2{grid-template-columns:1fr 1fr}
.ch.figc{flex-direction:column;gap:4px;padding:12px 8px;align-items:center}
.ch.figc svg{width:100%;height:auto;max-width:80px}
.ch{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:15px;
  padding:14px 15px;background:var(--card);cursor:pointer;font-size:15.5px;line-height:1.6;text-align:left;
  font-family:inherit;color:var(--ink);transition:border-color .15s, background .15s}
.ch:active{transform:scale(.99)}
.ch .mk{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub)}
.ch.on{border-color:var(--accent);background:var(--accent-soft)}
.ch.on .mk{background:var(--accent);border-color:var(--accent);color:#fff}

/* 記憶パート */
.memo{background:var(--c4s);border-radius:16px;padding:18px;margin:14px 0}
.memo .items{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.memo .items span{background:var(--card);border-radius:11px;padding:8px 14px;font-size:16px;font-weight:700}
.timer{font-family:"Roboto Mono",monospace;font-size:13px;color:var(--sub);text-align:center;margin-top:12px}

/* 結果 */
.score{display:flex;align-items:flex-end;gap:10px;margin:2px 0 18px}
.score b{font-family:"Roboto Mono",monospace;font-size:44px;font-weight:500;line-height:1}
.score span{color:var(--sub);font-size:13px;padding-bottom:6px}
.res{margin-bottom:11px}
.res .h{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;margin-bottom:5px}
.res .h .n{margin-left:auto;font-family:"Roboto Mono",monospace;font-size:13px;color:var(--sub)}
.rtrack{height:26px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.rtrack i{display:block;height:100%;border-radius:9px;transition:width .8s cubic-bezier(.3,1,.4,1)}
.res .c{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.8}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;margin-left:2px}
.tag.g{background:var(--c3s);color:var(--ok)}
.tag.w{background:var(--c2s);color:var(--warn)}
.note{background:var(--accent-soft);border-radius:16px;padding:16px 18px;font-size:13px;line-height:1.9;margin-top:18px}
.mini{font-size:11.5px;color:var(--sub);line-height:1.8;margin-top:16px}
details.rev{margin-top:14px}
details.rev>summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:700;list-style:none;padding:8px 0}
details.rev>summary::-webkit-details-marker{display:none}
details.rev>summary::after{content:" ▾"}
details.rev[open]>summary::after{content:" ▴"}
.rv{border-top:1px solid var(--line);padding:11px 0;font-size:13.5px;line-height:1.8}
.rv .a{color:var(--ok);font-weight:700}
.rv .x{color:var(--accent);font-weight:700}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>

const Q = [

      <line x1="104" y1="22" x2="104" y2="98" stroke="var(--accent)" stroke-width="4"/>
      <path d="M186 22h84v76h-84z"/>
      <line x1="228" y1="22" x2="228" y2="98" stroke="currentColor" stroke-width="1.6" stroke-dasharray="4 4" opacity=".45"/>
      <text x="228" y="68" font-size="28" text-anchor="middle" fill="currentColor" stroke="none" opacity=".35">?</text>
    </g>
    <g font-size="10.5" fill="currentColor" opacity=".6" text-anchor="middle">
      <text x="67" y="116">半分に折った紙</text>
      <text x="228" y="116">開くと？</text>
    </g>
    <g font-size="10" text-anchor="middle">
      <text x="104" y="16" fill="var(--accent)" font-weight="700">折り目</text>
      <text x="60" y="66" fill="var(--accent)" font-weight="700">切りとる</text>
    </g></svg>`,
};

// ── 状態 ──
const KEY='tokuimap_v1';
let st = {i:0, ans:{}, done:false, order:null};
try{ const s=localStorage.getItem(KEY); if(s) st=JSON.parse(s); }catch(e){}
// 🔴 出題データは正解を先頭に書いてあるので、必ず並べ替えてから出す
//    （そうしないと答えが全部いちばん上に並ぶ）。並び順は端末に保存する。
// 🔴 出題を直したら FIXV を上げ、直した問題の番号（0始まり）を FIXED に足すこと。
//    途中まで解いている人の答えは残したまま、その問題だけ答え直してもらう仕組み。
const FIXV = 4;
const FIXED = [18, 21, 37, 39];   // 19問=回転の図／22問=折り紙の折り目／38問=現在時刻／40問=基準が曖昧だった
const midway = Object.keys(st.ans).length > 0;
if(!st.order || st.order.length!==Q.length){
  // 途中で並べ替えると、保存済みの「何番目を選んだか」が別の選択肢を指してしまう。
  st.order = Q.map(q=>{
    const n=(q.figc||q.c).length, a=[...Array(n).keys()];
    if(midway) return a;
    for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  });
}
if(st.fixv !== FIXV){
  if(midway){
    const redo = FIXED.filter(i=>st.ans[i]!==undefined);
    redo.forEach(i=>{ delete st.ans[i]; });
    if(redo.length) st.fix = redo;
    if(st.done && redo.length) st.done = false;
  }
  st.fixv = FIXV;
}
const shown=i=>st.order[i];
const isRight=i=>st.ans[i]!==undefined && st.order[i][st.ans[i]]===Q[i].a;
const rightPos=i=>st.order[i].indexOf(Q[i].a);
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };
const el=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 記憶パートの表示フラグ（設問27の直前に一度だけ）
let memoShown = false;

function start(){
  el.innerHTML=`<h1>とくい・にがて マップ</h1>
  <p class="lede">50問こたえると、6つの分野それぞれで<b>とくい・にがて</b>がはっきり出ます。<br>
  早さは関係ありません。とちゅうでやめても、続きから再開できます。</p>
  <div class="card">
    <div style="display:grid;gap:10px">
      ${Object.entries(F).map(([k,v])=>`<div style="display:flex;align-items:center;gap:10px">
        <span class="dot" style="background:var(${v.c})"></span>
        <b style="font-size:14.5px">${v.name}</b>
        <span style="font-size:12.5px;color:var(--sub)">${v.d}</span></div>`).join('')}
    </div>
    <button class="btn" onclick="begin()">はじめる</button>
    ${Object.keys(st.ans).length?`<button class="btn ghost" onclick="reset()">さいしょからやり直す</button>`:''}
  </div>
  <p class="mini">※ これは病院の検査ではありません。得意なこと・苦手なことの地図をつくるだけのものです。<br>
  結果はこの端末の中だけに残ります。どこにも送られません。</p>`;
}
function begin(){ if(st.done){st.done=false;} render(); }
function reset(){ localStorage.removeItem(KEY); location.reload(); }

function render(){
  // 図を直した問題が未回答のまま残っていたら、先にそこへ案内する
  if(!st.done && st.fix && st.fix.length){
    const i=st.fix[0];
    el.innerHTML=`<div class="card">
      <div class="qno">お知らせ</div>
      <p class="q">第${i+1}問に足りない情報がありました。ごめんなさい。</p>
      <p class="qsub">問題を直したので、その1問だけ答え直してください。
      ほかの答えはそのまま残っています。（あと ${st.fix.length} 問）</p>
      <button class="btn" onclick="st.fix.shift();st.i=${i};save();render()">第${i+1}問にもどる</button>
    </div>`;
    window.scrollTo(0,0); return;
  }
  if(st.done) return result();
  if(st.i>=Q.length){ st.done=true; save(); return result(); }
  const q=Q[st.i], f=F[q.f];
  // 記憶リストは、その設問に入る直前に一度だけ見せる
  if(q.memo && !memoShown) return showMemo(q);
  const pct=Math.round(st.i/Q.length*100);
  el.innerHTML=`
  <div class="bar">
    <div class="t"><span class="dot" style="background:var(${f.c})"></span>
      <b>${f.name}</b><span>${f.d}</span>
      <span style="margin-left:auto;font-family:'Roboto Mono',monospace">${st.i+1} / ${Q.length}</span></div>
    <div class="track"><i style="width:${pct}%;background:var(${f.c})"></i></div>
  </div>
  <div class="card">
    <div class="qno">だい ${st.i+1} もん</div>
    <p class="q">${q.q}</p>
    ${q.fig?`<div class="figure">${FIGS[q.fig]}</div>`:''}
    ${q.figc
      ? `<div class="choices grid2">${shown(st.i).map((o,i)=>`<button class="ch figc${st.ans[st.i]===i?' on':''}" onclick="pick(${i})">
          ${FIGS[q.figc[o]]}<span style="font-size:12px;color:var(--sub)">${'①②③④'[i]}</span></button>`).join('')}</div>`
      : `<div class="choices">${shown(st.i).map((o,i)=>`<button class="ch${st.ans[st.i]===i?' on':''}" onclick="pick(${i})">
          <span class="mk">${'アイウエ'[i]}</span><span>${q.c[o]}</span></button>`).join('')}</div>`}
  </div>
  ${st.i>0?`<button class="btn ghost" onclick="back()">ひとつ前にもどる</button>`:''}`;
  window.scrollTo(0,0);
}
function showMemo(q){
  el.innerHTML=`<div class="card">
    <div class="qno">おぼえてください</div>
    <p class="q">つぎの5つを覚えてください。</p>
    <div class="memo"><div style="font-size:12.5px;color:var(--sub)">買い物リスト</div>
      <div class="items">${q.memo.map(m=>`<span>${m}</span>`).join('')}</div></div>
    <p class="qsub">覚えたら下のボタンを押してください。押すとリストは消えます。</p>
    <button class="btn" onclick="memoShown=true;render()">おぼえた</button>
  </div>`;
  window.scrollTo(0,0);
}
function pick(i){ st.ans[st.i]=i; save(); setTimeout(()=>{ st.i++; render(); },180); render(); }
function back(){ if(st.i>0){ st.i--; render(); } }

function result(){
  const by={}; Object.keys(F).forEach(k=>by[k]={n:0,ok:0,miss:[]});
  Q.forEach((q,i)=>{ const b=by[q.f]; b.n++; if(isRight(i)) b.ok++; else b.miss.push(i); });
  const total=Q.filter((q,i)=>isRight(i)).length;
  const rows=Object.entries(F).map(([k,v])=>({k,v,...by[k],p:Math.round(by[k].ok/by[k].n*100)}))
    .sort((a,b)=>b.p-a.p);
  const best=rows[0], worst=rows[rows.length-1];
  const cmt=r=> r.p>=85?'とくい。ここは任せて大丈夫。'
            : r.p>=70?'できている。'
            : r.p>=50?'半分くらい。時間をかければ届く。'
            : r.p>=30?'にがて。ひとりでやると間違えやすい。'
            :'かなりにがて。ここは仕組みで補ったほうが早い。';
  el.innerHTML=`
  <h1>けっか</h1>
  <div class="score"><b>${total}</b><span>／ ${Q.length}問</span></div>
  <div class="card">
    ${rows.map(r=>`<div class="res">
      <div class="h"><span class="dot" style="background:var(${r.v.c})"></span>${r.v.name}
        ${r.k===best.k?'<span class="tag g">いちばん とくい</span>':''}
        ${r.k===worst.k&&worst.p<best.p?'<span class="tag w">いちばん にがて</span>':''}
        <span class="n">${r.ok}/${r.n}</span></div>
      <div class="rtrack"><i style="width:${r.p}%;background:var(${r.v.c})"></i></div>
      <div class="c">${r.v.d} ・ ${cmt(r)}</div>
    </div>`).join('')}
  </div>
  <div class="note">
    <b>${best.v.name}（${best.p}%）</b>がいちばん得意、<b>${worst.v.name}（${worst.p}%）</b>がいちばん苦手でした。
    その差は<b>${best.p-worst.p}ポイント</b>です。<br><br>
    ${best.p-worst.p>=40
      ? '分野ごとの差が大きいタイプです。得意な分野で押して、苦手な分野は道具や仕組みで補うのが向いています。'
      : '分野ごとの差は小さめです。全体的に同じくらいの力の使い方をしています。'}<br><br>
    苦手なところは、やり方を変えると届くことが多いです。
    「おぼえる」が低ければメモ、「だんどり」が低ければ順番を紙に書く、「かず」が低ければ電卓を常に使う——それだけで変わります。
  </div>
  <details class="rev"><summary>まちがえた問題を見る（${Q.length-total}問）</summary>
    ${Q.map((q,i)=>isRight(i)?'':`<div class="rv">
      <div style="color:var(--sub);font-size:11.5px">${F[q.f].name}・第${i+1}問</div>
      <div style="margin:3px 0">${q.q}</div>
      <div>こたえ: <span class="a">${q.figc?'①②③④'[rightPos(i)]:esc(q.c[q.a])}</span>
      ${st.ans[i]!==undefined?` ／ えらんだの: <span class="x">${q.figc?'①②③④'[st.ans[i]]:esc(q.c[st.order[i][st.ans[i]]])}</span>`:' ／ <span class="x">むかいとう</span>'}</div>
    </div>`).join('')}
  </details>
  <button class="btn ghost" onclick="reset()">もういちど やる</button>
  <p class="mini">※ これは病院の検査ではありません。心配なことがあれば、専門の窓口（かかりつけ医・保健センターなど）に相談してください。</p>`;
  window.scrollTo(0,0);
}
save();
if(st.done||Object.keys(st.ans).length===0) start(); else render();
</script>

</body>
</html>
