<html lang="ja">

<title>知能テスト 40問</title>

<style>
:root{
  --bg:#f6f7fa; --card:#fff; --ink:#1e2430; --sub:#77808f; --line:#e3e7ee;
  --accent:#4a6fa5; --accent-soft:#eaf0f8; --gold:#b8893b;
  --c1:#4a6fa5; --c2:#3f8a7d; --c3:#a05c8a; --c4:#c07a3e; --c5:#5d6bb0; --c6:#7a8b4a;
  --ok:#2f7d5c; --bad:#b5483f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151922; --card:#1e2430; --ink:#e8ecf3; --sub:#94a0b3; --line:#2d3542;
  --accent:#7ba3d8; --accent-soft:#22303f; --gold:#d4a558;
  --c1:#7ba3d8; --c2:#5fb3a2; --c3:#c78ab0; --c4:#dba368; --c5:#8b96d8; --c6:#a3b370;
  --ok:#5cbf90; --bad:#e08078;
}}
:root[data-theme="dark"]{
  --bg:#151922; --card:#1e2430; --ink:#e8ecf3; --sub:#94a0b3; --line:#2d3542;
  --accent:#7ba3d8; --accent-soft:#22303f; --gold:#d4a558;
  --c1:#7ba3d8; --c2:#5fb3a2; --c3:#c78ab0; --c4:#dba368; --c5:#8b96d8; --c6:#a3b370;
  --ok:#5cbf90; --bad:#e08078;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:25px;font-weight:700;margin:0 0 4px;letter-spacing:.01em}
.lede{color:var(--sub);font-size:13.5px;line-height:1.85;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;
  font-family:inherit;background:var(--accent);color:#fff;cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:500;font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);margin:-18px -16px 14px;padding:11px 16px 12px;
  border-bottom:1px solid var(--line)}
.bar .t{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub);margin-bottom:7px}
.bar .t b{font-size:12.5px;color:var(--ink)}
.bar .clock{margin-left:auto;font-family:"Roboto Mono",monospace;font-size:12.5px;font-weight:700}
.bar .clock.over{color:var(--bad)}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .3s}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.qno{font-size:10.5px;letter-spacing:.12em;color:var(--sub);font-weight:700;margin-bottom:7px}
.q{font-size:17.5px;font-weight:700;line-height:1.75;margin:0}
.seq{font-family:"Roboto Mono",monospace;font-size:21px;font-weight:700;letter-spacing:.06em;
  background:var(--accent-soft);border-radius:12px;padding:16px;text-align:center;margin:15px 0 4px;
  word-break:break-word;line-height:1.7}
.figure{margin:15px 0 2px;text-align:center}
.figure svg{max-width:100%;height:auto}
.choices{display:grid;gap:8px;margin-top:15px}
.choices.grid4{grid-template-columns:1fr 1fr}
.ch{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;
  padding:13px 14px;background:var(--card);cursor:pointer;font-size:15.5px;line-height:1.55;text-align:left;
  font-family:inherit;color:var(--ink)}
.ch.num{font-family:"Roboto Mono",monospace;font-weight:700;font-size:17px;justify-content:center}
.ch .mk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub)}
.ch.on{border-color:var(--accent);background:var(--accent-soft)}
.ch.on .mk{background:var(--accent);border-color:var(--accent);color:#fff}
.ch.figc{flex-direction:column;gap:6px;padding:12px 8px}
.ch.figc svg{width:100%;height:auto;max-width:86px}
/* 結果 */
.hero{text-align:center;padding:26px 20px 22px}
.hero .n{font-family:"Roboto Mono",monospace;font-size:56px;font-weight:700;line-height:1;letter-spacing:-.02em}
.hero .of{color:var(--sub);font-size:13px;margin-top:6px}
.hero .band{display:inline-block;margin-top:14px;background:var(--accent-soft);color:var(--accent);
  border-radius:99px;padding:6px 16px;font-size:13.5px;font-weight:700}
.res{margin-bottom:12px}
.res .h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:5px}
.res .h .n{margin-left:auto;font-family:"Roboto Mono",monospace;font-size:12.5px;color:var(--sub)}
.rt{height:22px;border-radius:7px;background:var(--line);overflow:hidden}
.rt i{display:block;height:100%;border-radius:7px;transition:width .7s cubic-bezier(.3,1,.4,1)}
.res .c{font-size:12px;color:var(--sub);margin-top:4px}
.note{background:var(--accent-soft);border-radius:14px;padding:15px 17px;font-size:13px;line-height:1.9;margin-top:16px}
.mini{font-size:11.5px;color:var(--sub);line-height:1.8;margin-top:14px}
details.rev{margin-top:12px}
details.rev>summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:700;list-style:none;padding:8px 0}
details.rev>summary::-webkit-details-marker{display:none}
details.rev>summary::after{content:" ▾"} details.rev[open]>summary::after{content:" ▴"}
.rv{border-top:1px solid var(--line);padding:12px 0;font-size:13.5px;line-height:1.8}
.rv .a{color:var(--ok);font-weight:700} .rv .x{color:var(--bad);font-weight:700}
.rv .ex{color:var(--sub);font-size:12.5px;margin-top:3px}
</style>
</head>

const KEY='iqtest_v1';
let st={i:0,ans:{},done:false,t0:null,elapsed:0,order:null};
try{const s=localStorage.getItem(KEY); if(s) st=JSON.parse(s);}catch(e){}
// 🔴 出題データは正解を先頭に書いてあるので、必ず並べ替えてから出す。
//    並び順は端末に保存する（途中再開で答えがズレないため）。
if(!st.order || st.order.length!==Q.length){
  st.order = Q.map(q=>{
    const n=(q.figc||q.c).length, a=[...Array(n).keys()];
    for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  });
}
const shown=(i)=>st.order[i];               // 表示位置 → もとの番号
const isRight=(i)=>st.ans[i]!==undefined && st.order[i][st.ans[i]]===Q[i].a;
const rightPos=(i)=>st.order[i].indexOf(Q[i].a);   // 正解が表示上どこか
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const el=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LIMIT=35*60;
let tick=null;
function secs(){ return st.elapsed + (st.t0? Math.floor((Date.now()-st.t0)/1000):0); }
function mmss(s){ const m=Math.floor(s/60), x=s%60; return `${m}:${String(x).padStart(2,'0')}`; }

function start(){
  el.innerHTML=`<h1>知能テスト</h1>
  <p class="lede">40問・6分野。目安は35分ですが、時間を過ぎても続けられます。<br>
  分からない問題は飛ばさず、いちばん近いと思うものを選んでください。</p>
  <div class="card">
    <div style="display:grid;gap:9px">
      ${Object.entries(F).map(([k,v])=>`<div style="display:flex;align-items:center;gap:10px">
        <span class="dot" style="background:var(${v.c})"></span><b style="font-size:14px">${v.n}</b>
        <span style="font-size:12.5px;color:var(--sub)">${v.d}</span>
        <span style="margin-left:auto;font-family:'Roboto Mono',monospace;font-size:12px;color:var(--sub)">${Q.filter(q=>q.f===k).length}問</span></div>`).join('')}
    </div>
    <button class="btn" onclick="begin()">はじめる</button>
    ${Object.keys(st.ans).length?`<button class="btn ghost" onclick="reset()">最初からやり直す</button>`:''}
  </div>
  <p class="mini">結果はこの端末の中だけに保存されます。どこにも送信されません。<br>
  ※ 正式な知能検査（WAIS等）は専門家が実施するものです。これはWeb上のテストと同じ、あくまで目安です。</p>`;
}
function begin(){ st.done=false; if(!st.t0) st.t0=Date.now(); save(); render(); }
function reset(){ localStorage.removeItem(KEY); location.reload(); }

function render(){
  if(st.done) return result();
  if(st.i>=Q.length){ st.elapsed=secs(); st.t0=null; st.done=true; save(); return result(); }
  const q=Q[st.i], f=F[q.f], pct=Math.round(st.i/Q.length*100);
  const figc = q.figc ? `<div class="choices grid4">${shown(st.i).map((o,i)=>`<button class="ch figc${st.ans[st.i]===i?' on':''}" onclick="pick(${i})">
      ${box(q.figc[o],58)}<span style="font-size:12px;color:var(--sub)">${'①②③④'[i]}</span></button>`).join('')}</div>` : '';
  const norm = !q.figc ? `<div class="choices">${shown(st.i).map((o,i)=>{
      const c=q.c[o], isNum=/^[0-9０-９.,\s倍個つ日%km\/h時分約]+$/.test(c);
      return `<button class="ch${isNum?' num':''}${st.ans[st.i]===i?' on':''}" onclick="pick(${i})">
        ${isNum?'':`<span class="mk">${'アイウエ'[i]}</span>`}<span>${c}</span></button>`;}).join('')}</div>` : '';
  el.innerHTML=`
  <div class="bar">
    <div class="t"><span class="dot" style="background:var(${f.c})"></span><b>${f.n}</b>
      <span>${st.i+1} / ${Q.length}</span>
      <span class="clock" id="clk"></span></div>
    <div class="track"><i style="width:${pct}%;background:var(${f.c})"></i></div>
  </div>
  <div class="card">
    <div class="qno">第 ${st.i+1} 問</div>
    <p class="q">${q.q}</p>
    ${q.seq?`<div class="seq">${q.seq}</div>`:''}
    ${q.mx?`<div class="figure">${matrix(q.mx)}</div>`:''}
    ${figc}${norm}
  </div>
  ${st.i>0?`<button class="btn ghost" onclick="back()">前の問題にもどる</button>`:''}`;
  clock(); window.scrollTo(0,0);
}
function clock(){
  if(tick) clearInterval(tick);
  const upd=()=>{ const c=document.getElementById('clk'); if(!c) return;
    const s=secs(); c.textContent=mmss(s); c.className='clock'+(s>LIMIT?' over':''); };
  upd(); tick=setInterval(upd,1000);
}
function pick(i){ st.ans[st.i]=i; save(); render(); setTimeout(()=>{ st.i++; save(); render(); },170); }
function back(){ if(st.i>0){ st.i--; render(); } }

function result(){
  if(tick) clearInterval(tick);
  const by={}; Object.keys(F).forEach(k=>by[k]={n:0,ok:0});
  Q.forEach((q,i)=>{ by[q.f].n++; if(isRight(i)) by[q.f].ok++; });
  const total=Q.filter((q,i)=>isRight(i)).length;
  const p=total/Q.length*100;
  const band = p>=90?{t:'非常に高い',d:'この難易度で9割以上は、かなり上位の出来です。'}
             : p>=75?{t:'高い',d:'安定して規則を見つけられています。'}
             : p>=60?{t:'平均より上',d:'多くの分野で筋道を追えています。'}
             : p>=45?{t:'平均あたり',d:'解ける問題と落とす問題が半々です。'}
             : p>=30?{t:'平均より下',d:'型を知っていれば取れる問題を落としています。'}
             :        {t:'低め',d:'まず得意分野から解き方の型を覚えると伸びます。'};
  const rows=Object.entries(F).map(([k,v])=>({k,v,...by[k],p:Math.round(by[k].ok/by[k].n*100)})).sort((a,b)=>b.p-a.p);
  const best=rows[0], worst=rows[rows.length-1];
  el.innerHTML=`
  <div class="card hero">
    <div class="n">${total}<span style="font-size:22px;color:var(--sub)">/${Q.length}</span></div>
    <div class="of">正答率 ${Math.round(p)}% ・ 所要 ${mmss(st.elapsed||secs())}</div>
    <div class="band">${band.t}</div>
  </div>
  <div class="card">
    ${rows.map(r=>`<div class="res">
      <div class="h"><span class="dot" style="background:var(${r.v.c})"></span>${r.v.n}
        <span class="n">${r.ok}/${r.n}</span></div>
      <div class="rt"><i style="width:${r.p}%;background:var(${r.v.c})"></i></div>
      <div class="c">${r.v.d}</div></div>`).join('')}
  </div>
  <div class="note">${band.d}<br><br>
    いちばん取れたのは <b>${best.v.n}（${best.p}%）</b>、いちばん落としたのは <b>${worst.v.n}（${worst.p}%）</b>。
    その差は <b>${best.p-worst.p}ポイント</b>です。
    ${best.p-worst.p>=50?'分野による凸凹がはっきりしています。得意な型で押すのが向いています。'
      :'分野ごとの差は大きくありません。'}
  </div>
  <details class="rev"><summary>解説を見る（間違えた ${Q.length-total}問）</summary>
    ${Q.map((q,i)=>isRight(i)?'':`<div class="rv">
      <div style="color:var(--sub);font-size:11.5px">${F[q.f].n}・第${i+1}問</div>
      <div style="margin:3px 0">${q.q}${q.seq?`<br><span style="font-family:'Roboto Mono',monospace">${q.seq}</span>`:''}</div>
      <div>正解: <span class="a">${q.figc?'①②③④'[rightPos(i)]:esc(q.c[q.a])}</span>
      ${st.ans[i]!==undefined?` ／ 選択: <span class="x">${q.figc?'①②③④'[st.ans[i]]:esc(q.c[st.order[i][st.ans[i]]])}</span>`:' ／ <span class="x">無回答</span>'}</div>
      <div class="ex">${q.ex}</div></div>`).join('')}
  </details>
  <button class="btn ghost" onclick="reset()">もう一度やる</button>
  <p class="mini">※ 正式な知能検査ではありません。IQの数値は出していません。出せるのは「この40問での正答率と分野の凸凹」までです。</p>`;
  window.scrollTo(0,0);
}
save();
if(st.done||Object.keys(st.ans).length===0) start(); else render();
</script>
</body>
</html>
